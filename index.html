<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alvik Sim Hub</title>
<style>
/* Alvik Sim Hub shell: the frame around the three simulators. Offline: system fonts only. */
:root{
  --bg:#f4f6f8;--bar:#ffffff;--ink:#1f2933;--ink-2:#3a4450;--muted:#5d6772;--rule:#e1e6eb;
  --teal:#1f6f8b;--teal-ink:#ffffff;--field-blue:#2f6fd6;--field-red:#d64545;--tape:#1d2733;--floor:#f6f7f8;
  --focus:#1f6f8b;--toast-bg:#1f2933;--toast-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d;--bar:#181f27;--ink:#e8edf2;--ink-2:#c9d2db;--muted:#97a2ad;--rule:#2a333d;
  --teal:#5fb3cf;--teal-ink:#0f1a20;--tape:#e8edf2;--floor:#232c35;--focus:#5fb3cf;--toast-bg:#e8edf2;--toast-ink:#12171d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d;--bar:#181f27;--ink:#e8edf2;--ink-2:#c9d2db;--muted:#97a2ad;--rule:#2a333d;
  --teal:#5fb3cf;--teal-ink:#0f1a20;--tape:#e8edf2;--floor:#232c35;--focus:#5fb3cf;--toast-bg:#e8edf2;--toast-ink:#12171d;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:'Leelawadee UI','Thonburi','Noto Sans Thai','Sarabun',Tahoma,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--teal) 28%,transparent)}

.bar{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;gap:0 28px;
  padding:0 20px;background:var(--bar);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;padding:10px 0;min-width:0}
.brand svg{flex:none;width:30px;height:30px;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-name{font-weight:700;font-size:16px;letter-spacing:-.005em;white-space:nowrap}
.brand-sub{font-size:12.5px;color:var(--muted);white-space:nowrap}

.tabs{display:flex;align-items:stretch;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;color:var(--ink-2);background:transparent;border:0;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;
  padding:9px 14px 9px;position:relative;text-align:left;white-space:nowrap;border-radius:8px 8px 0 0;
  transition:background-color .15s ease-out,color .15s ease-out}
.tab-name{font-size:14.5px;font-weight:600}
.tab-desc{font-size:12px;color:var(--muted)}
.tab:hover{background:color-mix(in srgb,var(--teal) 7%,transparent);color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;
  border-radius:3px 3px 0 0;background:var(--teal)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

.tools{display:flex;align-items:center;gap:6px}
.icon-btn{font:inherit;font-size:13px;color:var(--ink-2);background:transparent;border:1px solid var(--rule);
  border-radius:8px;height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  transition:background-color .15s ease-out,border-color .15s ease-out}
.icon-btn:hover{background:color-mix(in srgb,var(--teal) 7%,transparent);border-color:color-mix(in srgb,var(--teal) 35%,var(--rule))}
.icon-btn:active{transform:translateY(1px)}
.icon-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.icon-btn svg{width:16px;height:16px;flex:none}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:4px;padding:0 4px;color:var(--muted)}

.stage{flex:1;position:relative;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.stage iframe.on{display:block}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:var(--toast-bg);color:var(--toast-ink);font-size:14px;padding:10px 16px;border-radius:10px;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.35);transition:opacity .2s cubic-bezier(.2,.8,.2,1),transform .2s cubic-bezier(.2,.8,.2,1);
  max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.present .bar{display:none}

@media (max-width:1100px){.brand-sub{display:none}}
@media (max-width:820px){
  .bar{grid-template-columns:1fr auto;padding:0 12px;gap:0 12px}
  .tabs{grid-column:1 / -1;grid-row:2;margin:0 -12px;padding:0 6px;border-top:1px solid var(--rule)}
  .tab{flex:1;align-items:center;text-align:center;padding:8px 8px}
  .tab-desc{display:none}
  .icon-btn .label{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="4" fill="var(--floor)" stroke="var(--rule)"/>
      <rect x="2.5" y="2.5" width="6" height="6" fill="var(--field-blue)"/>
      <rect x="13" y="2.5" width="6" height="6" fill="var(--field-blue)"/>
      <rect x="23.5" y="2.5" width="6" height="6" fill="var(--field-blue)"/>
      <rect x="12" y="22.5" width="8" height="8" fill="var(--field-red)"/>
      <path d="M6 6v20M11 6v20M16 6v20M21 6v20M26 6v20M6 6h20M6 11h20M6 16h20M6 21h20M6 26h20" stroke="var(--tape)" stroke-width="1.3" fill="none"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name">Alvik Sim Hub</span>
      <span class="brand-sub">สนามจำลองสำหรับการอบรม Arduino Day</span>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="หน้าจำลอง">
    <button class="tab" role="tab" id="tab-arena" data-page="arena" aria-controls="f-arena" aria-selected="true">
      <span class="tab-name">สนามแข่ง C++</span><span class="tab-desc">เขียนโค้ดแล้วรันภารกิจ Lift &amp; Park</span></button>
    <button class="tab" role="tab" id="tab-tap" data-page="tap" aria-controls="f-tap" aria-selected="false" tabindex="-1">
      <span class="tab-name">Tap Planner</span><span class="tab-desc">จิ้มสนามเพื่อสร้าง move และ rotate</span></button>
    <button class="tab" role="tab" id="tab-linetrack" data-page="linetrack" aria-controls="f-linetrack" aria-selected="false" tabindex="-1">
      <span class="tab-name">LineTrack</span><span class="tab-desc">ดูค่า IR 3 ตัวเมื่อหุ่นยนต์ออกนอกเส้น</span></button>
  </nav>
  <div class="tools">
    <button class="icon-btn" id="present" type="button" title="ซ่อนแถบด้านบนเพื่อฉายบนจอ (กด F)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
      <span class="label">โหมดนำเสนอ</span><kbd class="label">F</kbd>
    </button>
  </div>
</header>
<main class="stage" id="stage"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

ata-touch=\"ok\" class=\"t-ok\" aria-label=\"ปุ่ม ok\">✓<\/button><button data-touch=\"left\" aria-label=\"ปุ่ม left\">◀<\/button><button data-touch=\"center\" aria-label=\"ปุ่ม center\">●<\/button><button data-touch=\"right\" aria-label=\"ปุ่ม right\">▶<\/button><span><\/span><button data-touch=\"down\" aria-label=\"ปุ่ม down\">▼<\/button><span><\/span><\/div><div class=\"body-act\"><button id=\"lift-robot\" aria-pressed=\"false\" title=\"get_lifted() คืนค่า true และล้อหมุนลอย\">ยกตัวหุ่นขึ้น (get_lifted)<\/button><button id=\"shake-robot\" title=\"get_shake() คืนค่า true 0.6 วินาที\">เขย่า (get_shake)<\/button><\/div><\/div>\n<div class=\"panel\" id=\"mod-panel\" hidden=\"\"><div class=\"panel-head\"><b>Modulino (I2C Qwiic)<\/b><span class=\"muted\" id=\"mod-note\"><\/span><\/div><div id=\"mod-body\"><\/div><\/div>\n<details class=\"panel hw\"><summary>ชุดยก • ทีม B • ความสมจริง<\/summary><div class=\"hw-grid\"><label>พอร์ตเซอร์โวของชุดยก<select id=\"cfg-servo\"><option value=\"0\">Servo A (alvik.servo_A)<\/option><option value=\"1\">Servo B (alvik.servo_B)<\/option><\/select><\/label><label>ทีม B<select id=\"cfg-opponent\"><option value=\"ai\">AI สาธิต (เทียบเวลา)<\/option><option value=\"off\">ปิด (ซ้อมคนเดียว)<\/option><\/select><\/label><label>มุมเซอร์โวตอนลง (°)<input id=\"cfg-down\" type=\"number\" min=\"0\" max=\"180\" value=\"0\"><\/label><label>มุมเซอร์โวตอนยก (°)<input id=\"cfg-up\" type=\"number\" min=\"0\" max=\"180\" value=\"90\"><\/label><label>ระยะยกสูงสุด (มม.)<input id=\"cfg-height\" type=\"number\" min=\"1\" max=\"60\" value=\"22\"><\/label><label>ความเร็วเซอร์โว (°/วินาที)<input id=\"cfg-sspeed\" type=\"number\" min=\"30\" max=\"1200\" value=\"300\"><\/label><label>ล้อซ้าย/ขวาไม่เท่ากัน<select id=\"cfg-error\"><option value=\"0\">0% • อุดมคติ<\/option><option value=\"0.005\">0.5% • เล็กน้อย<\/option><option value=\"0.01\">1% • ปานกลาง<\/option><option value=\"0.03\">3% • มาก<\/option><\/select><\/label><label>ระยะคลาดจากกลางแท่นที่ยกได้ (มม.)<input id=\"cfg-tol\" type=\"number\" min=\"5\" max=\"50\" value=\"30\"><\/label><\/div><p>ตั้งค่าให้ตรงกับชุดยกจริงของทีม มีผลเมื่อกดรันครั้งถัดไป • ลองเพิ่มความคลาดเคลื่อนของล้อเพื่อดูว่าโค้ดแบบนับระยะ (dead reckoning) ยังจอดได้ไหม<\/p><\/details><\/aside><\/div>\n<details class=\"api\"><summary>ฟังก์ชันที่แบบจำลองรองรับ (ชื่อเดียวกับไลบรารี Arduino_Alvik 1.1)<\/summary><div class=\"api-grid\"><div><h3>เคลื่อนที่<\/h3><p><code>alvik.move(cm)<\/code> เดินหน้า/ถอย แล้วรอจนถึง<\/p><p><code>alvik.rotate(deg)<\/code> หมุนอยู่กับที่ (+ ซ้าย)<\/p><p><code>alvik.drive(cm_s, deg_s)<\/code> ความเร็วเชิงเส้น/เชิงมุม<\/p><p><code>alvik.set_wheels_speed(l, r)<\/code> หน่วย RPM (สูงสุด 70)<\/p><p><code>alvik.brake()<\/code> • <code>alvik.is_target_reached()<\/code><\/p><p><code>alvik.get_pose(x, y, th)<\/code> • <code>reset_pose()<\/code><\/p><p><code>alvik.left_wheel.set_speed()<\/code> / <code>get_position()<\/code><\/p><\/div><div><h3>เซนเซอร์<\/h3><p><code>alvik.get_line_sensors(l, c, r)<\/code> ดำ ≈ 900, ขาว ≈ 40<\/p><p><code>alvik.get_distance(l, cl, c, cr, r)<\/code> ToF 5 โซน (cm)<\/p><p><code>alvik.get_distance_top()<\/code> / <code>_bottom()<\/code><\/p><p><code>alvik.get_color_label()<\/code> \"white\" \"black\" \"blue\" \"red\"<\/p><p><code>alvik.get_color(r, g, b)<\/code> • <code>get_color_raw()<\/code><\/p><p><code>alvik.get_orientation(roll, pitch, yaw)<\/code> • <code>get_gyros()<\/code><\/p><p><code>alvik.get_touch_ok()<\/code> และปุ่มอื่น ๆ<\/p><\/div><div><h3>ชุดยก • ไฟ • Arduino<\/h3><p><code>alvik.servo_A.set_position(0–180)<\/code><\/p><p><code>alvik.set_servo_positions(a, b)<\/code><\/p><p><code>alvik.left_led.set_color(r, g, b)<\/code><\/p><p><code>delay()<\/code> <code>millis()<\/code> <code>Serial.print()<\/code> <code>Serial.printf()<\/code><\/p><p><code>map()<\/code> <code>constrain()<\/code> <code>abs()<\/code> <code>random()<\/code> <code>sin()<\/code>…<\/p><p>รองรับ int/float/bool/String, array, struct, enum, #define, static<\/p><p>ไม่รองรับ pointer, class และไลบรารีอื่น<\/p><\/div><div><h3>FreeRTOS • Serial • Modulino<\/h3><p><code>xTaskCreate(fn, \"name\", stack, NULL, prio, &amp;h)<\/code> task ทำงานคู่ขนาน<\/p><p><code>vTaskDelay()<\/code> <code>vTaskDelete(NULL)<\/code> <code>pdMS_TO_TICKS()<\/code><\/p><p><code>Serial.available()<\/code> <code>read()<\/code> <code>readStringUntil()<\/code> <code>parseInt()<\/code><\/p><p><code>ModulinoPixels<\/code> <code>ModulinoDistance<\/code> (ติดหน้าหุ่น) <code>ModulinoButtons<\/code><\/p><p><code>ModulinoBuzzer<\/code> <code>ModulinoKnob<\/code> <code>ModulinoMovement<\/code> <code>ModulinoThermo<\/code><\/p><p>ไร้สาย (ESP-NOW, WiFi), micro-ROS และอัปเดตเฟิร์มแวร์ต้องใช้บอร์ดจริง<\/p><\/div><\/div><\/details><\/section>\n<div class=\"below\"><section class=\"control-card\"><p class=\"eyebrow\">ลองเล่นด้วยตัวเอง<\/p><h2>ขับเข้ากลางใต้แท่น แล้วกดยก<\/h2><p>ลูกศร / WASD ขับตามทิศบนแผนผังสนาม<br>Space ยกหรือวาง • P พัก / เล่นต่อ<\/p><div class=\"pad\"><button data-dir=\"0,-1\" class=\"up\" aria-label=\"ขับไปด้านบนสนาม\">↑<\/button><button data-dir=\"-1,0\" class=\"left\" aria-label=\"ขับไปด้านซ้ายสนาม\">←<\/button><button id=\"lift\" class=\"lift\" aria-label=\"ยกหรือวางแท่น\" disabled=\"\">ยก / วาง<\/button><button data-dir=\"1,0\" class=\"right\" aria-label=\"ขับไปด้านขวาสนาม\">→<\/button><button data-dir=\"0,1\" class=\"down\" aria-label=\"ขับไปด้านล่างสนาม\">↓<\/button><\/div><p id=\"help\" class=\"hint\" aria-live=\"polite\">จบการแข่งขัน • กดเริ่มใหม่เพื่อลองอีกครั้ง<\/p><\/section><section class=\"info-card\"><h2>สนามจริง &amp; เกณฑ์ตัดสิน<\/h2><div class=\"facts\"><span>ไวนิล <b>800 × 800 มม.<\/b><\/span><span>3D Print + อะคริลิก <b>≈ 90 กรัม / แท่น<\/b><\/span><\/div><div class=\"legend\"><span><i class=\"blue\"><\/i>จุดจอด<\/span><span><i class=\"red\"><\/i>จุดเริ่มต้น<\/span><span><i class=\"black\"><\/i>เส้นทาง<\/span><\/div><ol><li>ครบ 3 แท่นก่อน ชนะ<\/li><li>เมื่อหมดเวลา จอดสำเร็จมากกว่า ชนะ<\/li><li>ผลเท่ากัน ดูเวลายกแท่นแรก<\/li><li>ไม่มีทีมยกสำเร็จ ดูเวลาพ้นกรอบแดง<\/li><\/ol><p>นับแท่นเมื่อขาทั้ง 4 ขาวางบนพื้น และพื้นที่สัมผัสของทุกขาอยู่ในสีน้ำเงินทั้งหมด ยกสำเร็จเมื่อขาทั้ง 4 ขาลอยพ้นพื้นพร้อมกัน<\/p><details><summary>ขอบเขตของแบบจำลอง<\/summary><p>ใช้ภาพต้นฉบับกำหนดตำแหน่งสนามทั้ง 3 แบบ ขนาดย่อยที่ยังไม่ได้ระบุใช้ค่าประมาณ: จุดจอด 140 × 140 มม., ระยะห่างขาแท่น 120 มม., หน้าตัดขา 12 × 12 มม., ตัวหุ่นยนต์ประมาณ 86 × 86 มม. กลไกยกเป็นตัวอย่างอุปกรณ์เสริม<\/p><p>ความเร็วและเวลาเลี้ยว/ยกเป็นค่าจำลอง ทีม B ใช้ความเร็ว 92% ของทีม A เพื่อเปรียบเทียบผล ไม่ใช่ผลทดสอบ Alvik จริง แบบจำลองตรวจสิ่งกีดขวางและขอบสนาม แต่ไม่ได้จำลองแรงเสียดทาน มอเตอร์ หรือเซนเซอร์จริง<\/p><p><b>โหมดเขียนโค้ด:<\/b> แปลงโค้ด C++ เป็น JavaScript ในเบราว์เซอร์ ใช้ชื่อฟังก์ชัน หน่วย ค่าคงที่ และสูตรสีตามไลบรารี Arduino_Alvik 1.1.1 (ล้อ ⌀34 มม., ระยะล้อ 89 มม., สูงสุด 70 RPM) move() ใช้ ≈100 มม./วินาที และ rotate() ≈100 °/วินาที พร้อมหน่วงเวลาแบบไลบรารีจริง ชุดยกคำนวณจากมุมเซอร์โว ค่าเซนเซอร์เส้น ToF และความเร็วเซอร์โวเป็นค่าประมาณ ขอบสนามทำหน้าที่เหมือนผนัง ควรทดสอบกับหุ่นจริงก่อนแข่งเสมอ<\/p><p>การออกตัวในเกมใช้ตัวหุ่นยนต์ทั้งตัวพ้นกรอบแดง หากเวลายกแท่นแรกเท่ากัน หรือไม่มีทีมใดออกตัว จะแสดงว่ายังแยกผลไม่ได้ เพราะยังไม่มีเกณฑ์เพิ่มเติม<\/p><\/details><\/section><\/div>\n<footer>FIG. 01 — LIFT &amp; PARK <span>สร้างด้วย Anatomy • ตัวอย่าง Arduino_Alvik © Arduino SA (MPL-2.0) • โค้ด C++ รันในเบราว์เซอร์ ไม่ต้องเชื่อมต่ออินเทอร์เน็ต<\/span><\/footer>\n<\/main><script type=\"module\">const AZIMUTH = 45;\nconst ELEVATION = 30;\nconst SHADES = 4;\nconst RADIANS = Math.PI / 180;\nconst UNIT = Math.sqrt(1.6);\nfunction cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {\n    const a = azimuth * RADIANS;\n    const e = elevation * RADIANS;\n    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };\n}\nfunction iso([x, y, z], projection) {\n    const { origin } = projection;\n    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);\n    return [origin[0] + (x * sinA - y * cosA) * k, origin[1 nnew IntersectionObserver(entries=>{visible=entries.at(-1).isIntersecting;if(visible)kick();},{rootMargin:'120px'}).observe(document.querySelector('main'));\ndocument.addEventListener('visibilitychange',()=>{keys.clear();pointerDirection=null;lastFrame=0;kick();});\nui('layout').addEventListener('change',e=>{layoutIndex=Number(e.target.value);resetGame();});\nui('random').onclick=()=>{layoutIndex=Math.floor(Math.random()*3);ui('layout').value=layoutIndex;resetGame();ui('help').textContent=`สุ่มได้แบบที่ ${layoutIndex+1} • ทั้งสองทีมใช้รูปแบบเดียวกัน`;};\nui('setup').onclick=startSetup;ui('start').onclick=startMatch;ui('reset').onclick=resetGame;\nui('demo').onclick=()=>{mode='auto';ui('mode').value='auto';resetGame();startMatch();};\nui('pause').onclick=()=>{if(phase!=='match'&&phase!=='setup')return;running=!running;keys.clear();pointerDirection=null;recordControls();draw();kick();};\nui('mode').onchange=e=>{mode=e.target.value;resetGame();};ui('show-sensors').onchange=e=>{showSensors=e.target.checked;draw();};ui('speed').oninput=e=>{speed=Number(e.target.value);ui('speed-label').textContent=`${speed} มม./วินาที`;};\nui('rate').onchange=e=>{rate=Number(e.target.value);};ui('view').onclick=()=>{topView=!topView;ui('view').setAttribute('aria-pressed',topView);ui('view').textContent=topView?'มองแบบมุมเอียง':'มองจากด้านบน';rebuild();};\nui('theme').onclick=()=>{const dark=document.body.dataset.theme==='light';document.body.dataset.theme=dark?'dark':'light';ui('theme').textContent=dark?'โหมดสว่าง':'โหมดมืด';};\nfunction userLift(){if(phase==='match'&&running&&mode==='manual'){Sim.beginLift(teams[0]);ui('help').textContent=teams[0].status;draw();}}\nui('lift').onclick=userLift;\ndocument.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;const key=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' ','p'].includes(key)){if(phase==='match')e.preventDefault();if(key===' '&&!e.repeat){userLift();return;}if(key==='p'&&!e.repeat){ui('pause').click();return;}if(phase==='match'&&running)keys.add(key);}});\ndocument.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>{keys.clear();pointerDirection=null;});\nfor(const button of document.querySelectorAll('[data-dir]')){button.addEventListener('pointerdown',e=>{if(phase!=='match'||!running||mode!=='manual')return;e.preventDefault();button.setPointerCapture(e.pointerId);pointerDirection=button.dataset.dir.split(',').map(Number);});for(const ev of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(ev,()=>pointerDirection=null);}\n\n/* ---------- code editor + runner UI ---------- */\nconst EXAMPLES={\"linetrack_target\": \"/*  Line tracking ถึง target (สนามแบบที่ 1 — แท่นกลาง)\\n    1) เดินตามเส้นจากจุดเริ่มจนครบ DIST_TO_PLATFORM → หยุดใต้แท่น → ยก\\n    2) เดินตามเส้นต่อจนครบ DIST_TO_ZONE → หยุดในจุดจอดสีน้ำเงิน → วาง\\n    3) ถอยออกจากใต้แท่น\\n    target ใช้ระยะทางจาก wheel encoder (get_wheels_position)               */\\n#include \\\"Arduino_Alvik.h\\\"\\nArduino_Alvik alvik;\\n\\nint line_sensors[3];\\n\\n// ===== ปรับค่าตรงนี้ =====\\nconst float DIST_TO_PLATFORM = 31.6;  // [cm] จุดเริ่ม → กลางใต้แท่น\\nconst float DIST_TO_ZONE     = 61.8;  // [cm] จุดเริ่ม → กลางจุดจอด\\nconst float BASE_RPM         = 25.0;  // ความเร็วเดินหน้า [rpm]\\nconst int   LIFT_DOWN        = 0;     // มุมเซอร์โว A ตอนลง\\nconst int   LIFT_UP          = 90;    // มุมเซอร์โว A ตอนยก\\nconst float WHEEL_D_CM       = 3.4;   // เส้นผ่านศูนย์กลางล้อ Alvik\\n\\nenum State { TO_PLATFORM, LIFTING, TO_ZONE, DROPPING, BACK_OFF, DONE };\\nState state = TO_PLATFORM;\\n\\nfloat start_wheel_deg = 0;\\n\\nvoid setup() {\\n  Serial.begin(115200);\\n  alvik.begin();\\n  alvik.set_illuminator(true);\\n  alvik.set_servo_positions(LIFT_DOWN, 0);\\n\\n  alvik.left_led.set_color(1,0,0);            // LED แดง = รอกด OK\\n  alvik.right_led.set_color(1,0,0);\\n  while(!alvik.get_touch_ok()) delay(10);\\n  while(alvik.get_touch_ok())  delay(10);     // รอปล่อยปุ่ม\\n\\n  alvik.left_led.set_color(0,1,0);\\n  alvik.right_led.set_color(0,1,0);\\n\\n  float l, r;\\n  alvik.get_wheels_position(l, r);\\n  start_wheel_deg = (l + r) / 2.0;\\n}\\n\\n// ===== function เดิมของคุณ (ไม่แก้) =====\\nint prev_sensor1 = 0 , prev_sensor2 = 0 , prev_sensor3 = 0;\\nfloat calculate_value_from_sensors(int sensor1 , int sensor2 , int sensor3)\\n{\\n  float centroid = 0;\\n  float sum_value = 1* sensor1 + 2*sensor2 + 3*sensor3;\\n  float sum_weight = sensor1 + sensor2 + sensor3;\\n\\n  if (sum_weight!=0.0){\\n    centroid = sum_value / sum_weight;\\n    centroid=centroid-2.0;\\n  }\\n\\n  if(sensor1 <= 420)sensor1 = 0;\\n  if(sensor2 <= 420)sensor2 = 0;\\n  if(sensor3 <= 420)sensor3 = 0;\\n\\n  if(sensor1 == 0 && sensor2 == 0 && sensor3 == 0)\\n  {\\n    if(prev_sensor1 == 0 && prev_sensor2 == 0 && prev_sensor3 != 0)\\n    {\\n      centroid = 0.8;\\n    }\\n    else if(prev_sensor1 != 0 && prev_sensor2 == 0 && prev_sensor3 == 0)\\n    {\\n      centroid = -0.8;\\n    }\\n  }\\n  else\\n  {\\n    prev_sensor1 = sensor1;\\n    prev_sensor2 = sensor2;\\n    prev_sensor3 = sensor3;\\n  }\\n\\n  return -centroid;\\n}\\n\\nfloat pid_control_heading(float error , float kp , float ki , float kd , float max_sum_err , float time_loop)\\n{\\n  static float sum_error , prev_error , omega;\\n  static float  prev_time ;\\n\\n  if(millis() - prev_time >= time_loop)\\n  {\\n    prev_time = millis();\\n    sum_error += error * time_loop * 1e-3;\\n\\n    if(sum_error >= max_sum_err)       sum_error = max_sum_err;\\n    else if(sum_error <= -max_sum_err) sum_error = -max_sum_err;\\n\\n    float P = error * kp;\\n    float I = sum_error * ki;\\n    float D = (error - prev_error)/(time_loop * 1e-3) * kd;\\n    prev_error = error;\\n    omega  = P + I + D;\\n  }\\n  return omega;\\n}\\n\\n// ===== ระยะที่วิ่งมาแล้ว [cm] จาก encoder =====\\nfloat travelled_cm()\\n{\\n  float l, r;\\n  alvik.get_wheels_position(l, r);\\n  return ((l + r) / 2.0 - start_wheel_deg) / 360.0 * PI * WHEEL_D_CM;\\n}\\n\\nvoid follow_line()\\n{\\n  alvik.get_line_sensors(line_sensors[0], line_sensors[1], line_sensors[2]);\\n  float error = calculate_value_from_sensors(line_sensors[0], line_sensors[1], line_sensors[2]);\\n  float heading_cmd = pid_control_heading(error , 20 , 0 , 5 , 1000, 20);\\n  alvik.set_wheels_speed(BASE_RPM - heading_cmd , BASE_RPM + heading_cmd);\\n}\\n\\n// ===== main loop 50 Hz =====\\nunsigned long prev_time_ctrl = 0;\\n\\nvoid loop() {\\n  if (millis() - prev_time_ctrl < 20) return;\\n  prev_time_ctrl = millis();\\n\\n  switch (state)\\n  {\\n    case TO_PLATFORM:\\n      if (travelled_cm() >= DIST_TO_PLATFORM) {\\n        alvik.brake();\\n        Serial.print(\\\"ถึงแท่น d = \\\");\\n        Serial.println(travelled_cm());\\n        state = LIFTING;\\n      } else follow_line();\\n      break;\\n\\n    case LIFTING:\\n      delay(200);                              // รอหุ่นนิ่ง\\n      alvik.set_servo_positions(LIFT_UP, 0);\\n      delay(500);\\n      Serial.println(\\\"ยกแท่นแล้ว\\\");\\n      state = TO_ZONE;\\n      break;\\n\\n    case TO_ZONE:\\n      if (travelled_cm() >= DIST_TO_ZONE) {\\n        alvik.brake();\\n        Serial.print(\\\"ถึงจุดจอด d = \\\");\\n        Serial.println(travelled_cm());\\n        state = DROPPING;\\n      } else follow_line();\\n      break;\\n\\n    case DROPPING:\\n      delay(200);\\n      alvik.set_servo_positions(LIFT_DOWN, 0);\\n      delay(500);\\n      Serial.println(\\\"วางแท่นแล้ว\\\");\\n      state = BACK_OFF;\\n      break;\\n\\n    case BACK_OFF:\\n      alvik.move(-15);                         // ถอยออกจากใต้แท่น 15 cm\\n      alvik.brake();\\n      alvik.left_led.set_color(1,1,1);         // LED ขาว = เสร็จ\\n      alvik.right_led.set_color(1,1,1);\\n      Serial.println(\\\"เสร็จ\\\");\\n      state = DONE;\\n      break;\\n\\n    case DONE:\\n      break;\\n  }\\n}\\n\", \"mission\": \"/*  ภารกิจเต็ม: ยกและจอดครบ 3 แท่น (dead reckoning ด้วย move/rotate)\\n    - เปลี่ยน LAYOUT ให้ตรงกับสนามที่สุ่มได้ (1, 2 หรือ 3)\\n    - ชุดยกต่อกับพอร์ต Servo A ของ Alvik: มุม LIFT_DOWN = ลง, LIFT_UP = ยก\\n    - หน่วยของ move() คือ cm, rotate() คือองศา (+ = เลี้ยวซ้าย)            */\\n#include \\\"Arduino_Alvik.h\\\"\\n\\nArduino_Alvik alvik;\\n\\n#define LAYOUT 1\\nconst int LIFT_DOWN = 0;\\nconst int LIFT_UP = 90;\\n\\nenum Op { FWD, TURN, UP, DOWN };\\nstruct Step { int op; float val; };\\n\\nconst Step ROUTE1[] = {\\n  {FWD, 31.6}, {UP, 0}, {FWD, 30.2}, {DOWN, 0},                       // กลาง -> จุดจอดกลาง\\n  {FWD, -45.4}, {TURN, -90}, {FWD, 15.2}, {UP, 0},\\n  {FWD, 15.2}, {TURN, 90}, {FWD, 45.4}, {DOWN, 0},                     // ขวา -> จุดจอดขวา\\n  {FWD, -45.4}, {TURN, 90}, {FWD, 45.6}, {UP, 0},\\n  {FWD, 15.2}, {TURN, -90}, {FWD, 45.4}, {DOWN, 0}                     // ซ้าย -> จุดจอดซ้าย\\n};\\nconst Step ROUTE2[] = {\\n  {FWD, 61.8}, {TURN, -90}, {FWD, 30.4}, {TURN, -90}, {FWD, 15.0}, {UP, 0}, {FWD, -15.0}, {DOWN, 0},\\n  {FWD, 30.2}, {UP, 0}, {FWD, -15.2}, {DOWN, 0}, {TURN, -90}, {UP, 0}, {FWD, 30.4}, {DOWN, 0},\\n  {TURN, -90}, {UP, 0}, {FWD, 15.0}, {DOWN, 0},\\n  {FWD, -45.4}, {TURN, -90}, {FWD, 30.4}, {UP, 0}, {FWD, -60.8}, {DOWN, 0}, {TURN, 90}, {UP, 0}, {FWD, 45.4}, {DOWN, 0}\\n};\\nconst Step ROUTE3[] = {\\n  {FWD, 62.0}, {TURN, 90}, {FWD, 15.2}, {UP, 0}, {FWD, 15.2}, {DOWN, 0},\\n  {FWD, -30.4}, {TURN, 90}, {FWD, 15.2}, {TURN, 90}, {FWD, 15.2}, {UP, 0}, {FWD, 15.2}, {DOWN, 0},\\n  {TURN, 90}, {UP, 0}, {FWD, 15.0}, {DOWN, 0},\\n  {FWD, -45.4}, {TURN, 90}, {FWD, 45.6}, {UP, 0}, {FWD, -15.2}, {DOWN, 0}, {TURN, -90}, {UP, 0}, {FWD, 45.4}, {DOWN, 0}\\n};\\n\\nint parked = 0;\\n\\nvoid lift(bool up) {\\n  alvik.servo_A.set_position(up ? LIFT_UP : LIFT_DOWN);\\n  delay(350);                                   // รอเซอร์โวหมุนจนสุด\\n  if (!up) {\\n    parked++;\\n    Serial.print(\\\"วางแท่นแล้ว \\\");\\n    Serial.print(parked);\\n    Serial.print(\\\" ครั้ง  t = \\\");\\n    Serial.println(millis() / 1000.0);\\n  }\\n}\\n\\nvoid runRoute(const Step route[], int n) {\\n  for (int i = 0; i < n; i++) {\\n    Step s = route[i];\\n    switch (s.op) {\\n      case FWD:  alvik.move(s.val); break;\\n      case TURN: alvik.rotate(s.val); break;\\n      case UP:   lift(true); break;\\n      case DOWN: lift(false); break;\\n    }\\n  }\\n}\\n\\nvoid setup() {\\n  Serial.begin(115200);\\n  alvik.begin();\\n  alvik.servo_A.set_position(LIFT_DOWN);\\n  alvik.left_led.set_color(0, 0, 1);\\n  alvik.right_led.set_color(0, 0, 1);\\n  while (!alvik.get_touch_ok()) {               // กด OK เพื่อเริ่ม\\n    delay(10);\\n  }\\n  alvik.left_led.set_color(0, 1, 0);\\n  alvik.right_led.set_color(0, 1, 0);\\n\\n  if (LAYOUT == 1) runRoute(ROUTE1, sizeof(ROUTE1) / sizeof(ROUTE1[0]));\\n  else if (LAYOUT == 2) runRoute(ROUTE2, sizeof(ROUTE2) / sizeof(ROUTE2[0]));\\n  else runRoute(ROUTE3, sizeof(ROUTE3) / sizeof(ROUTE3[0]));\\n\\n  Serial.println(\\\"เสร็จภารกิจ\\\");\\n}\\n\\nvoid loop() {\\n  alvik.brake();\\n  delay(100);\\n}\\n\", \"basics\": \"// พื้นฐาน: ขับ ยก วาง (สนามแบบที่ 1 — แท่นกลาง)\\n#include \\\"Arduino_Alvik.h\\\"\\n\\nArduino_Alvik alvik;\\n\\nvoid setup() {\\n  Serial.begin(115200);\\n  alvik.begin();\\n  alvik.servo_A.set_position(0);        // ชุดยกลง (เซอร์โวพอร์ต A)\\n\\n  while (!alvik.get_touch_ok()) {       // รอกด OK — แบบจำลองกดให้อัตโนมัติ\\n    delay(10);\\n  }\\n\\n  alvik.move(31.6);                     // เดินหน้า 31.6 cm ไปอยู่กลางใต้แท่น\\n  alvik.servo_A.set_position(90);       // ยกแท่น\\n  delay(400);\\n  alvik.move(30.2);                     // พาแท่นไปจุดจอดสีน้ำเงินตรงกลาง\\n  alvik.servo_A.set_position(0);        // วางแท่น\\n  delay(400);\\n  Serial.println(\\\"จอดแท่นแรกแล้ว\\\");\\n\\n  alvik.move(-20);                      // ถอยออกมา 20 cm\\n  alvik.rotate(90);                     // เลี้ยวซ้าย 90 องศา (+ = ซ้าย, - = ขวา)\\n}\\n\\nvoid loop() {\\n  alvik.brake();\\n  delay(100);\\n}\\n\", \"linefollow\": \"// ตัวอย่างเดินตามเส้นจาก Arduino_Alvik/examples/line_follower (ปรับคอมเมนต์)\\n#include \\\"Arduino_Alvik.h\\\"\\n\\nArduino_Alvik alvik;\\n\\nint line_sensors[3];\\nfloat error = 0;\\nfloat control = 0;\\nfloat kp = 50.0;\\n\\nvoid setup() {\\n  Serial.begin(115200);\\n  alvik.begin();\\n  alvik.left_led.set_color(0, 0, 1);\\n  alvik.right_led.set_color(0, 0, 1);\\n\\n  while (!alvik.get_touch_ok()) {\\n    delay(50);\\n  }\\n}\\n\\nvoid loop() {\\n  while (!alvik.get_touch_cancel()) {\\n    alvik.get_line_sensors(line_sensors[0], line_sensors[1], line_sensors[2]);\\n    Serial.print(line_sensors[0]);\\n    Serial.print(\\\"\\\\t\\\");\\n    Serial.print(line_sensors[1]);\\n    Serial.print(\\\"\\\\t\\\");\\n    Serial.println(line_sensors[2]);\\n\\n    error = calculate_center(line_sensors[0], line_sensors[1], line_sensors[2]);\\n    control = error * kp;\\n    if (control > 0.2) {\\n      alvik.left_led.set_color(1, 0, 0);\\n      alvik.right_led.set_color(0, 0, 0);\\n    } else if (control < -0.2) {\\n      alvik.left_led.set_color(0, 0, 0);\\n      alvik.right_led.set_color(1, 0, 0);\\n    } else {\\n      alvik.left_led.set_color(0, 1, 0);\\n      alvik.right_led.set_color(0, 1, 0);\\n    }\\n\\n    alvik.set_wheels_speed(30 - control, 30 + control);\\n    delay(100);\\n  }\\n\\n  while (!alvik.get_touch_ok()) {        // กด ✕ เพื่อหยุด, กด OK เพื่อไปต่อ\\n    alvik.left_led.set_color(0, 0, 1);\\n    alvik.right_led.set_color(0, 0, 1);\\n    alvik.brake();\\n    delay(100);\\n  }\\n}\\n\\nfloat calculate_center(const int left, const int center, const int right) {\\n  float centroid = 0.0;\\n  float sum_weight = left + center + right;\\n  float sum_values = left + center * 2 + right * 3;\\n  if (sum_weight != 0.0) {               // ป้องกันหารด้วยศูนย์\\n    centroid = sum_values / sum_weight;\\n    centroid = -centroid + 2.0;          // ให้ 0 = อยู่กลางเส้น\\n  }\\n  return centroid;\\n}\\n\", \"sensors\": \"// อ่านเซนเซอร์
