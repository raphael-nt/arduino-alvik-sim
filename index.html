dex,mode})),reset:resetGame,start:startMatch,demo:()=>ui('demo').click(),step:seconds=>{for(let t=0;t<seconds&&running;t+=.02)advanceGame(Math.min(.02,seconds-t));draw();},setLayout:index=>{layoutIndex=index;ui('layout').value=index;resetGame();},lift:userLift};\nrebuild();recordControls();\n<\/script><\/body><\/html>"</script>
<script type="application/json" id="page-linetrack">"<!doctype html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>LineTrack Sim<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap\">\n<style>\n/* Layout: field (the robot's floor, seen from above) on the left, readout + code on the right; stacks on phones */\n:root{\n  --bg:#ffffff; --panel:#ffffff; --ink:#1d2733; --body:#434950; --muted:#6f7680;\n  --accent:#1f6f8b; --led:#e07a3f; --led-glow:rgba(224,122,63,.45); --led-soft:#fdf1ea;\n  --rule:#e3e8ed; --soft:#f3f5f8; --code-hl:#fde9dc;\n  --floor:#f4f6f8; --floor-tick:#e2e7ec; --tape:#1d2733; --chassis:#ffffff; --chassis-edge:#1d2733; --wheel:#56606b; --board:#ffffff; --board-edge:#c9d1d9; --led-off:#ffffff; --led-off-edge:#9aa3ad;\n  --f-display:'Sarabun','Leelawadee UI','Tahoma',sans-serif;\n  --f-mono:'JetBrains Mono','Consolas','Courier New',monospace;\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n  --bg:#12171d; --panel:#181f27; --ink:#e8edf2; --body:#c2c9d1; --muted:#8c96a1;\n  --accent:#5fb3cf; --led:#f08a4b; --led-glow:rgba(240,138,75,.55); --led-soft:#2c211b;\n  --rule:#2a333d; --soft:#1e262f; --code-hl:#3a2a20; color-scheme:dark } }\n:root[data-theme=\"dark\"]{\n  --bg:#12171d; --panel:#181f27; --ink:#e8edf2; --body:#c2c9d1; --muted:#8c96a1;\n  --accent:#5fb3cf; --led:#f08a4b; --led-glow:rgba(240,138,75,.55); --led-soft:#2c211b;\n  --rule:#2a333d; --soft:#1e262f; --code-hl:#3a2a20; color-scheme:dark }\n\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--body);font-family:var(--f-display);font-size:16px;line-height:1.5;margin:0}\n.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 32px}\nheader{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin-bottom:16px}\n.brand{font-weight:700;color:var(--ink);font-size:15px}\n.brand span{color:var(--accent)}\nh1{margin:2px 0 0;font-size:clamp(24px,3.2vw,32px);line-height:1.2;color:var(--ink);font-weight:700;text-wrap:balance}\n.modes{display:inline-flex;border:1px solid var(--rule);border-radius:10px;padding:3px;background:var(--panel)}\n.modes button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--body);padding:6px 14px;border-radius:7px;cursor:pointer}\n.modes button[aria-pressed=\"true\"]{background:var(--accent);color:var(--bg);font-weight:600}\nbutton:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n\n.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:22px;align-items:start}\n@media (max-width:860px){ .grid{grid-template-columns:minmax(0,1fr)} }\n\n.field-card{border:1px solid var(--rule);border-radius:14px;background:var(--panel);padding:14px;min-width:0}\nsvg#field{display:block;width:100%;max-width:520px;margin:0 auto;height:auto;touch-action:none;cursor:ew-resize;border-radius:10px}\n.controls{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-width:520px;margin-inline:auto}\ninput[type=range]{width:100%;accent-color:var(--accent)}\n.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}\n.btns{display:flex;flex-wrap:wrap;gap:6px}\n.btns button{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--panel);color:var(--body);border-radius:8px;padding:4px 11px;cursor:pointer}\n.btns button:hover{border-color:var(--accent);color:var(--accent)}\n.hint{font-size:13px;color:var(--muted);margin:0}\n[data-only]{display:none}\nbody[data-mode=\"manual\"] [data-only=\"manual\"], body[data-mode=\"run\"] [data-only=\"run\"]{display:flex}\n\n.side{display:flex;flex-direction:column;gap:14px;min-width:0}\n.card{border:1px solid var(--rule);border-radius:14px;background:var(--panel);padding:16px 18px}\n.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px}\n.leds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}\n.led{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;border:2px solid var(--led-off-edge);background:var(--led-off);transition:background .12s,box-shadow .12s,border-color .12s}\n.led.on{background:var(--led);border-color:var(--led);box-shadow:0 0 0 6px var(--led-glow),0 0 18px var(--led-glow)}\n.led-name{font-size:14px;color:var(--body)}\n.led-val{font-family:var(--f-mono);font-weight:600;font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums}\n.led-val.on{color:var(--led)}\n.statebar{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:14px}\n.st{font-family:var(--f-mono);font-size:11px;text-align:center;padding:5px 0;border-radius:6px;background:var(--soft);color:var(--muted);line-height:1.25}\n.st b{display:block;font-size:13px;color:var(--body)}\n.st.on{background:var(--led);color:var(--bg)}\n.st.on b{color:var(--bg)}\n.action{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}\n.action strong{font-size:24px;color:var(--ink)}\n.action .bits{font-family:var(--f-mono);font-size:15px;color:var(--muted)}\n.wheels{display:grid;grid-template-columns:56px minmax(0,1fr) 48px;gap:8px 10px;align-items:center;margin-top:12px;font-size:14px}\n.track{height:12px;background:var(--soft);border-radius:6px;position:relative;overflow:hidden}\n.fill{position:absolute;top:0;bottom:0;left:0;border-radius:6px;background:var(--accent);transition:width .15s}\n.fill.rev{background:var(--led)}\n.num{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}\n.code{font-family:var(--f-mono);font-size:12.5px;line-height:1.7;background:var(--soft);border:1px solid var(--rule);border-radius:10px;padding:10px 0;overflow-x:auto;color:var(--ink)}\n.code div{padding:0 14px;white-space:pre;border-left:3px solid transparent;transition:background .12s}\n.code div.on{background:var(--code-hl);border-left-color:var(--led)}\n.code .c{color:var(--muted)}\n.foot{font-size:13px;color:var(--muted);margin-top:4px}\n.pwm{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:2px 12px;align-items:center}\n.pwm label{font-size:14px;color:var(--body);display:flex;justify-content:space-between;gap:8px;grid-column:1/-1;margin-top:6px}\n.pwm label code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}\n.pwm input[type=range]{grid-column:1}\n.pwm input[type=number]{grid-column:2;width:100%;font-family:var(--f-mono);font-size:13px;padding:3px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}\n.pwm-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}\n.pwm-actions button{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--panel);color:var(--body);border-radius:8px;padding:4px 11px;cursor:pointer}\n.pwm-actions button:hover{border-color:var(--accent);color:var(--accent)}\n.warn{font-size:13px;color:var(--led);margin:8px 0 0}\npre.out{font-family:var(--f-mono);font-size:12px;line-height:1.6;background:var(--soft);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;margin:10px 0 0;overflow-x:auto;color:var(--ink);user-select:all}\n@media (prefers-reduced-motion: reduce){ .led,.fill,.code div{transition:none} }\n<\/style>\n<\/head>\n<body>\n\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <div class=\"brand\">Line<span>Track<\/span> · sim<\/div>\n      <h1>เลื่อนหุ่นออกซ้าย–ขวา แล้วดูไฟ IR<\/h1>\n    <\/div>\n    <div class=\"modes\" role=\"group\" aria-label=\"โหมด\">\n      <button id=\"m-manual\" aria-pressed=\"true\">เลื่อนเอง<\/button>\n      <button id=\"m-run\" aria-pressed=\"false\">ให้หุ่นวิ่ง<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"grid\">\n    <div class=\"side\">\n    <section class=\"field-card\" aria-label=\"สนามจำลอง\">\n      <svg id=\"field\" viewBox=\"0 0 400 440\" role=\"img\" aria-label=\"หุ่นมองจากด้านบน วางทับเส้นสีดำ\">\n        <defs>\n          <marker id=\"ah-a\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"4.5\" markerHeight=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--accent)\"/><\/marker>\n          <marker id=\"ah-l\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"4.5\" markerHeight=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--led)\"/><\/marker>\n          <clipPath id=\"clip\"><rect width=\"400\" height=\"440\" rx=\"10\"/><\/clipPath>\n        <\/defs>\n        <g clip-path=\"url(#clip)\">\n          <rect width=\"400\" height=\"440\" style=\"fill:var(--floor)\"/>\n          <g id=\"ticks\"><\/g>\n          <rect x=\"178\" y=\"0\" width=\"44\" height=\"440\" style=\"fill:var(--tape)\"/>\n          <g id=\"robot\">\n            <rect x=\"-70\" y=\"-13\" width=\"10\" height=\"46\" rx=\"3\" style=\"fill:var(--wheel)\"/>\n            <rect x=\"60\" y=\"-13\" width=\"10\" height=\"46\" rx=\"3\" style=\"fill:var(--wheel)\"/>\n            <rect x=\"-58\" y=\"-65\" width=\"116\" height=\"130\" rx=\"14\" style=\"fill:var(--chassis);fill-opacity:.78;stroke:var(--chassis-edge);stroke-width:1.6\"/>\n            <rect x=\"-48\" y=\"-63\" width=\"96\" height=\"20\" rx=\"10\" style=\"fill:var(--board);fill-opacity:.92;stroke:var(--board-edge)\"/>\n            <circle id=\"g0\" cx=\"-32\" cy=\"-53\" r=\"13\" style=\"fill:var(--led-glow)\" opacity=\"0\"/>\n            <circle id=\"g1\" cx=\"0\" cy=\"-53\" r=\"13\" style=\"fill:var(--led-glow)\" opacity=\"0\"/>\n            <circle id=\"g2\" cx=\"32\" cy=\"-53\" r=\"13\" style=\"fill:var(--led-glow)\" opacity=\"0\"/>\n            <circle id=\"s0\" cx=\"-32\" cy=\"-53\" r=\"8.5\" stroke-width=\"2\"/>\n            <circle id=\"s1\" cx=\"0\" cy=\"-53\" r=\"8.5\" stroke-width=\"2\"/>\n            <circle id=\"s2\" cx=\"32\" cy=\"-53\" r=\"8.5\" stroke-width=\"2\"/>\n            <path id=\"arrow\" d=\"\" fill=\"none\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n          <\/g>\n        <\/g>\n      <\/svg>\n\n      <div class=\"controls\">\n        <div data-only=\"manual\" style=\"flex-direction:column;gap:4px\">\n          <input type=\"range\" id=\"slider\" min=\"-110\" max=\"110\" value=\"0\" aria-label=\"ตำแหน่งหุ่น\">\n          <div class=\"scale\"><span>← หุ่นออกซ้าย<\/span><span>กลางเส้น<\/span><span>หุ่นออกขวา →<\/span><\/div>\n        <\/div>\n        <div class=\"btns\" data-only=\"manual\">\n          <button data-d=\"0\">ปกติ<\/button>\n          <button data-d=\"-16\">ออกซ้ายนิด<\/button>\n          <button data-d=\"-38\">ออกซ้ายเกิน<\/button>\n          <button data-d=\"16\">ออกขวานิด<\/button>\n          <button data-d=\"38\">ออกขวาเกิน<\/button>\n          <button data-d=\"-95\">หลุดเส้น<\/button>\n        <\/div>\n        <div class=\"btns\" data-only=\"run\">\n          <button id=\"pushL\">← ผลักไปซ้าย<\/button>\n          <button id=\"pushR\">ผลักไปขวา →<\/button>\n          <button id=\"pause\">หยุดชั่วคราว<\/button>\n          <button id=\"reset\">วางกลับกลางเส้น<\/button>\n        <\/div>\n        <div data-only=\"run\" style=\"flex-direction:column;gap:4px\">\n          <label for=\"speed\" class=\"hint\">ความเร็วจำลอง <span id=\"speedv\">0.5×<\/span><\/label>\n          <input type=\"range\" id=\"speed\" min=\"0.15\" max=\"1\" step=\"0.05\" value=\"0.5\">\n        <\/div>\n        <p class=\"hint\" id=\"hint\">ลากหุ่นในสนาม ใช้แถบเลื่อน หรือกดปุ่ม ← → บนคีย์บอร์ด<\/p>\n      <\/div>\n    <\/section>\n      <div class=\"card\">\n        <p class=\"label\">ตั้งค่า PWM (0–255)<\/p>\n        <div class=\"pwm\" id=\"pwm\"><\/div>\n        <p class=\"warn\" id=\"warn\" hidden><\/p>\n        <div class=\"pwm-actions\">\n          <button id=\"copyCfg\">คัดลอกเป็นโค้ด<\/button>\n          <button id=\"resetCfg\">ค่าเริ่มต้น<\/button>\n        <\/div>\n        <pre class=\"out\" id=\"cfgOut\"><\/pre>\n      <\/div>\n    <\/div>\n\n    <aside class=\"side\">\n      <div class=\"card\">\n        <p class=\"label\">ไฟ IR บนหุ่น<\/p>\n        <div class=\"leds\">\n          <div><div class=\"led\" id=\"led0\"><\/div><div class=\"led-name\">ซ้าย<\/div><div class=\"led-val\" id=\"v0\">0<\/div><\/div>\n          <div><div class=\"led\" id=\"led1\"><\/div><div class=\"led-name\">กลาง<\/div><div class=\"led-val\" id=\"v1\">0<\/div><\/div>\n          <div><div class=\"led\" id=\"led2\"><\/div><div class=\"led-name\">ขวา<\/div><div class=\"led-val\" id=\"v2\">0<\/div><\/div>\n        <\/div>\n        <div class=\"statebar\" id=\"statebar\" aria-label=\"8 state\"><\/div>\n        <p class=\"foot\">ไฟติด = 1 = เจอเส้นดำ · 3 ตัว × 2 ค่า = 2³ = 8 state<\/p>\n      <\/div>\n\n      <div class=\"card\">\n        <div class=\"action\"><strong id=\"act\">วิ่งตรง<\/strong><span class=\"bits\" id=\"stateTxt\">state 2<\/span><\/div>\n        <div class=\"wheels\">\n          <span>ล้อซ้าย<\/span><div class=\"track\"><div class=\"fill\" id=\"fL\"><\/div><\/div><span class=\"num\" id=\"nL\">135<\/span>\n          <span>ล้อขวา<\/span><div class=\"track\"><div class=\"fill\" id=\"fR\"><\/div><\/div><span class=\"num\" id=\"nR\">150<\/span>\n        <\/div>\n        <p class=\"foot\" id=\"lastTxt\">lastSide = 0<\/p>\n      <\/div>\n\n      <div class=\"code\" id=\"code\" aria-label=\"โค้ดใน loop()\">\n        <div data-b=\"both\">if (left &amp;&amp; right)  <span class=\"c\">// วิ่งตรง<\/span><\/div>\n        <div data-b=\"right\">else if (right)       <span class=\"c\">// เลี้ยวขวา<\/span><\/div>\n        <div data-b=\"left\">else if (left)        <span class=\"c\">// เลี้ยวซ้าย<\/span><\/div>\n        <div data-b=\"center\">else if (center)      <span class=\"c\">// วิ่งตรง<\/span><\/div>\n        <div data-b=\"lastL\">else if (lastSide == -1) <span class=\"c\">// หมุนซ้ายหา<\/span><\/div>\n        <div data-b=\"lastR\">else if (lastSide == 1)  <span class=\"c\">// หมุนขวาหา<\/span><\/div>\n        <div data-b=\"off\">else                  <span class=\"c\">// หยุด<\/span><\/div>\n      <\/div>\n\n    <\/aside>\n  <\/div>\n<\/div>\n\n<script>\n// ---- same logic as line_track_demo.ino (1 = sensor over black line) ----\nconst LINE_X = 200, LINE_HALF = 22, SP = 32, NOSE = 53, ROBOT_Y = 300;\nconst DEFAULTS = { maxSpeed:150, leftOffset:15, rightOffset:0, slowSpeed:20, softTurn:1.5, hardTurn:2.5, searchSpeed:-35 };\nconst P = { ...DEFAULTS };\nconst MOTOR_BIAS = 15;   // sim: left motor runs 15 PWM stronger than the right, like the real robot\nconst pwm = v => Math.max(-255, Math.min(255, Math.trunc(v)));   // motorLeft(int) truncates, analogWrite tops out at 255\n\nfunction sense(x, th){\n  return [-SP, 0, SP].map(o => {\n    const wx = x + o*Math.cos(th) + NOSE*Math.sin(th);\n    return Math.abs(wx - LINE_X) < LINE_HALF ? 1 : 0;\n  });\n}\nfunction decide(left, center, right, lastSide){\n  const { maxSpeed, leftOffset, rightOffset, slowSpeed, softTurn, hardTurn, searchSpeed } = P;\n  const turn = slowSpeed * (center ? softTurn : hardTurn);\n  let r;\n  if (left && right) r = { l:maxSpeed-leftOffset, r:maxSpeed-rightOffset, b:'both', txt:'วิ่งตรง', dir:0, lastSide };\n  else if (right) r = { l:maxSpeed-leftOffset, r:maxSpeed-turn-rightOffset, b:'right', txt: center?'เลี้ยวขวาเบา':'เลี้ยวขวาแรง', dir: center?1:2, lastSide:1 };\n  else if (left)  r = { l:maxSpeed-turn-leftOffset, r:maxSpeed-rightOffset, b:'left', txt: center?'เลี้ยวซ้ายเบา':'เลี้ยวซ้ายแรง', dir: center?-1:-2, lastSide:-1 };\n  else if (center) r = { l:maxSpeed-leftOffset, r:maxSpeed-rightOffset, b:'center', txt:'วิ่งตรง', dir:0, lastSide };\n  else if (lastSide === -1) r = { l:searchSpeed, r:0, b:'lastL', txt:'หลุดเส้น → หมุนซ้ายหา', dir:-3, lastSide };\n  else if (lastSide === 1)  r = { l:0, r:searchSpeed, b:'lastR', txt:'หลุดเส้น → หมุนขวาหา', dir:3, lastSide };\n  else r = { l:0, r:0, b:'off', txt:'หลุดเส้น → หยุด', dir:null, lastSide };\n  r.l = pwm(r.l); r.r = pwm(r.r);\n  return r;\n}\n\n// ---- state ----\nlet mode = 'manual', x = LINE_X, th = 0, lastSide = 0, scroll = 0, paused = false, dragging = false, speedK = 0.5;\nconst $ = id => document.getElementById(id);\nconst svg = $('field');\n\n// floor ticks (show forward motion in run mode)\nconst ticks = $('ticks');\nfor (let i = 0; i < 13; i++){\n  const r = document.createElementNS('http://www.w3.org/2000/svg','rect');\n  r.setAttribute('x', 0); r.setAttribute('width', 400); r.setAttribute('height', 2);\n  r.style.fill = 'var(--floor-tick)'; ticks.appendChild(r);\n}\nfunction drawTicks(){ [...ticks.children].forEach((r,i)=> r.setAttribute('y', ((i*40 + scroll) % 520) - 40)); }\n\n// state strip\nconst strip = $('statebar');\nfor (let i = 0; i < 8; i++){\n  const b = [(i>>2)&1,(i>>1)&1,i&1];\n  strip.insertAdjacentHTML('beforeend', `<div class=\"st\" id=\"st${i}\"><b>${i}<\/b>${b.join('')}<\/div>`);\n}\n\nconst ARROWS = {\n  0:  'M0 -74 V-112',\n  1:  'M0 -74 Q0 -106 30 -110', 2: 'M0 -74 Q0 -104 50 -112',\n  '-1':'M0 -74 Q0 -106 -30 -110','-2':'M0 -74 Q0 -104 -50 -112',\n  3:  'M0 -74 Q0 -104 50 -112', '-3':'M0 -74 Q0 -104 -50 -112',\n};\n\n// manual mode: nose turns toward where the code is steering (pivot on the sensor bar so readings stay put)\nconst TURN_DEG = { 0:0, 1:12, 2:24, 3:32, '-1':-12, '-2':-24, '-3':-32 };\nconst reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet targetDeg = 0, visDeg = 0;\nfunction placeRobot(){\n  $('robot').setAttribute('transform', mode === 'manual'\n    ? `translate(${x} ${ROBOT_Y}) rotate(${visDeg} 0 -53)`\n    : `translate(${x} ${ROBOT_Y}) rotate(${th*180/Math.PI})`);\n}\n\nfunction render(){\n  const s = sense(x, th), d = decide(...s, lastSide);\n  if (mode === 'manual') targetDeg = d.dir === null ? 0 : TURN_DEG[d.dir];\n  placeRobot();\n  s.forEach((v,i)=>{\n    const c = $('s'+i);\n    c.style.fill = v ? 'var(--led)' : 'var(--led-off)';\n    c.style.stroke = v ? 'var(--led-off)' : 'var(--led-off-edge)';\n    $('g'+i).setAttribute('opacity', v ? 1 : 0);\n    $('led'+i).classList.toggle('on', !!v);\n    $('v'+i).textContent = v; $('v'+i).classList.toggle('on', !!v);\n  });\n  const idx = s[0]*4 + s[1]*2 + s[2];\n  for (let i = 0; i < 8; i++) $('st'+i).classList.toggle('on', i === idx);\n  $('act').textContent = d.txt;\n  $('stateTxt').textContent = `${s.join(' ')} · state ${idx}`;\n  [['L',d.l],['R',d.r]].forEach(([k,v])=>{\n    const f = $('f'+k); f.style.width = (Math.abs(v)/255*100)+'%'; f.classList.toggle('rev', v < 0);\n    $('n'+k).textContent = v;\n  });\n  const ar = $('arrow');\n  if (d.dir === null){ ar.setAttribute('d',''); }\n  else {\n    const hard = Math.abs(d.dir) >= 2;\n    ar.setAttribute('d', ARROWS[d.dir]);\n    ar.style.stroke = hard ? 'var(--led)' : 'var(--accent)';\n    ar.setAttribute('marker-end', hard ? 'url(#ah-l)' : 'url(#ah-a)');\n  }\n  document.querySelectorAll('#code div').forEach(el => el.classList.toggle('on', el.dataset.b === d.b));\n  return d;\n}\n\nfunction commit(d){ lastSide = d.lastSide; $('lastTxt').textContent = `lastSide = ${lastSide}  (${lastSide===1?'เห็นเส้นทางขวาล่าสุด':lastSide===-1?'เห็นเส้นทางซ้ายล่าสุด':'ยังไม่เคยเห็นเส้น'})`; }\n\n// ---- manual mode ----\nfunction setX(nx){ x = Math.max(LINE_X-110, Math.min(LINE_X+110, nx)); $('slider').value = Math.round(x-LINE_X); commit(render()); }\n$('slider').addEventListener('input', e => { th = 0; setX(LINE_X + +e.target.value); });\ndocument.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { th = 0; setX(LINE_X + +b.dataset.d); }));\n\n// drag on field (both modes)\nfunction svgX(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()).x; }\nsvg.addEventListener('pointerdown', ev => { dragging = true; svg.setPointerCapture(ev.pointerId); th = 0; setX(svgX(ev)); });\nsvg.addEventListener('pointermove', ev => { if (dragging){ th = 0; setX(svgX(ev)); } });\n['pointerup','pointercancel'].forEach(t => svg.addEventListener(t, () => dragging = false));\naddEventListener('keydown', ev => {\n  if (ev.target.tagName === 'INPUT' && ev.target.type === 'range') return;\n  if (ev.key === 'ArrowLeft'){ ev.preventDefault(); if (mode==='run') push(-1); else setX(x-4); }\n  if (ev.key === 'ArrowRight'){ ev.preventDefault(); if (mode==='run') push(1); else setX(x+4); }\n});\n\n// ---- run mode ----\nfunction push(dir){ x = Math.max(LINE_X-110, Math.min(LINE_X+110, x + dir*28)); th += dir*0.25; commit(render()); }\n$('pushL').onclick = () => push(-1);\n$('pushR').onclick = () => push(1);\n$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'วิ่งต่อ' : 'หยุดชั่วคราว'; };\n$('reset').onclick = () => { x = LINE_X; th = 0; lastSide = 0; commit(render()); };\n$('speed').addEventListener('input', e => { speedK = +e.target.value; $('speedv').textContent = speedK.toFixed(2).replace(/0$/,'') + '×'; });\n\nlet prev = null;\nfunction tick(t){\n  if (prev === null) prev = t;\n  const realDt = Math.min(0.05, (t - prev)/1000), dt = realDt * speedK; prev = t;\n  if (mode === 'manual' && visDeg !== targetDeg){\n    visDeg = reduceMotion || Math.abs(targetDeg - visDeg) < 0.2 ? targetDeg : visDeg + (targetDeg - visDeg) * Math.min(1, realDt * 7);\n    placeRobot();\n  }\n  if (mode === 'run' && !paused && !dragging){\n    const d = decide(...sense(x, th), lastSide); lastSide = d.lastSide;\n    // motors: left one is 15 stronger in real life, which leftOffset cancels\n    const eL = d.l > 0 ? d.l + MOTOR_BIAS : d.l, eR = d.r;\n    th += (eL - eR) * 0.02 * dt;\n    th = Math.max(-1.2, Math.min(1.2, th));\n    const v = (eL + eR)/2 * 0.8;\n    x += v * Math.sin(th) * dt;\n    if (x < LINE_X-150 || x > LINE_X+150){ x = Math.max(LINE_X-150, Math.min(LINE_X+150, x)); }\n    scroll = (scroll + v*Math.cos(th)*dt) % 520; if (scroll < 0) scroll += 520;\n    drawTicks(); commit(render());\n  }\n  requestAnimationFrame(tick);\n}\n\nfunction setMode(m){\n  mode = m; document.body.dataset.mode = m;\n  $('m-manual').setAttribute('aria-pressed', m==='manual');\n  $('m-run').setAttribute('aria-pressed', m==='run');\n  $('hint').textContent = m === 'manual'\n    ? 'ลากหุ่นในสนาม ใช้แถบเลื่อน หรือกดปุ่ม ← → บนคีย์บอร์ด'\n    : 'หุ่นวิ่งตามโค้ดจริง ลองผลักหรือลากหุ่นออกจากเส้น แล้วดูมันแก้ทางกลับมา';\n  if (m === 'manual'){ visDeg = th*180/Math.PI; th = 0; setX(x); }\n  if (m === 'run' && Math.abs(x-LINE_X) < 4){ x = LINE_X - 40; th = 0; }\n  commit(render());\n}\n$('m-manual').onclick = () => setMode('manual');\n$('m-run').onclick = () => setMode('run');\n\n// ---- PWM settings ----\nconst FIELDS = [\n  ['maxSpeed',   'ความเร็วสูงสุด', 'maxSpeed',   0, 255, 1],\n  ['leftOffset', 'ลดล้อซ้าย',      'leftOffset', 0, 80,  1],\n  ['rightOffset','ลดล้อขวา',       'rightOffset',0, 80,  1],\n  ['slowSpeed',  'ลดตอนเลี้ยว',    'slowSpeed',  0, 100, 1],\n  ['softTurn',   'ตัวคูณเลี้ยวเบา', 'softTurn',   0, 5,   0.1],\n  ['hardTurn',   'ตัวคูณเลี้ยวแรง', 'hardTurn',   0, 8,   0.1],\n  ['searchSpeed','ความเร็วหมุนหาเส้น','searchSpeed',-255, 0, 1],\n];\nconst box = $('pwm');\nFIELDS.forEach(([k,label,code,min,max,step])=>{\n  box.insertAdjacentHTML('beforeend',\n    `<label for=\"r-${k}\"><span>${label}<\/span><code>${code}<\/code><\/label>\n     <input type=\"range\" id=\"r-${k}\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${P[k]}\">\n     <input type=\"number\" id=\"n-${k}\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${P[k]}\" aria-label=\"${label}\">`);\n});\nconst fmt = (k,v) => (k==='softTurn'||k==='hardTurn') ? (+v).toFixed(1) : String(Math.round(v));\nfunction cfgText(){\n  const c = { maxSpeed:'top speed (0 - 255)', leftOffset:'slow the left wheel by this much', rightOffset:'slow the right wheel by this much',\n    slowSpeed:'how much to slow down when turning', softTurn:'small turn = slowSpeed x this', hardTurn:'big turn = slowSpeed x this' };\n  return Object.keys(c).map(k => `float ${k} = ${fmt(k,P[k])};`.padEnd(26) + `// ${c[k]}`).join('\\n')\n    + '\\n' + `int searchSpeed = ${fmt('searchSpeed',P.searchSpeed)};`.padEnd(26) + '// spin speed when the line is lost';\n}\nfunction checkWarn(){\n  const hard = P.maxSpeed - P.slowSpeed*P.hardTurn - Math.max(P.leftOffset,P.rightOffset);\n  const msgs = [];\n  if (hard < 0) msgs.push(`เลี้ยวแรงแล้วล้อด้านในติดลบ (${Math.trunc(hard)}) ล้อนั้นจะหมุนถอยหลัง`);\n  if (P.maxSpeed - P.leftOffset < 60 || P.maxSpeed - P.rightOffset < 60) msgs.push('PWM ต่ำมาก มอเตอร์จริงอาจไม่หมุน');\n  $('warn').hidden = !msgs.length; $('warn').textContent = msgs.join(' · ');\n}\nfunction applyCfg(){\n  FIELDS.forEach(([k])=>{ $('r-'+k).value = P[k]; $('n-'+k).value = fmt(k,P[k]); });\n  $('cfgOut').textContent = cfgText(); checkWarn(); commit(render());\n}\nFIELDS.forEach(([k,,,min,max])=>{\n  $('r-'+k).addEventListener('input', e => { P[k] = +e.target.value; applyCfg(); });\n  $('n-'+k).addEventListener('change', e => { const v = +e.target.value; if (!isNaN(v)) P[k] = Math.max(min, Math.min(max, v)); applyCfg(); });\n});\n$('resetCfg').onclick = () => { Object.assign(P, DEFAULTS); applyCfg(); };\n$('copyCfg').onclick = () => {\n  const t = cfgText(), btn = $('copyCfg');\n  const done = () => { btn.textContent = 'คัดลอกแล้ว'; setTimeout(()=> btn.textContent = 'คัดลอกเป็นโค้ด', 1500); };\n  const sel = () => { const r = document.createRange(); r.selectNodeContents($('cfgOut')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'กด Ctrl+C เพื่อคัดลอก'; };\n  try { navigator.clipboard.writeText(t).then(done, sel); } catch(e){ sel(); }\n};\n\ndrawTicks(); setMode('manual'); applyCfg();\nrequestAnimationFrame(tick);\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script type="application/json" id="page-tap">"<!doctype html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Tap Planner<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap\">\n<style>\n:root{\n  --bg:#ffffff; --panel:#ffffff; --ink:#1d2733; --body:#434950; --muted:#6f7680;\n  --accent:#1f6f8b; --accent-soft:#e3f0f5; --led:#e07a3f; --led-soft:#fdf1ea;\n  --rule:#e3e8ed; --soft:#f3f5f8;\n  --floor:#f6f7f8; --grid:#e6eaee; --tape:#1d2733; --blue:#2f6fd6; --red:#d64545;\n  --glass:rgba(31,111,139,.10); --glass-edge:#5b7f8c; --chassis:#ffffff; --wheel:#56606b;\n  --f-display:'Sarabun','Leelawadee UI','Tahoma',sans-serif;\n  --f-mono:'JetBrains Mono','Consolas','Courier New',monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n  --bg:#12171d; --panel:#181f27; --ink:#e8edf2; --body:#c2c9d1; --muted:#8c96a1;\n  --accent:#5fb3cf; --accent-soft:#1d3440; --led:#f08a4b; --led-soft:#2c211b;\n  --rule:#2a333d; --soft:#1e262f;\n  --floor:#d9dde1; --grid:#c5ccd2; --tape:#151b21; --blue:#2f6fd6; --red:#c94040;\n  --glass:rgba(95,179,207,.16); --glass-edge:#4f7280; --chassis:#f4f6f8; --wheel:#4a535d;\n  color-scheme:dark } }\n:root[data-theme=\"dark\"]{\n  --bg:#12171d; --panel:#181f27; --ink:#e8edf2; --body:#c2c9d1; --muted:#8c96a1;\n  --accent:#5fb3cf; --accent-soft:#1d3440; --led:#f08a4b; --led-soft:#2c211b;\n  --rule:#2a333d; --soft:#1e262f;\n  --floor:#d9dde1; --grid:#c5ccd2; --tape:#151b21; --blue:#2f6fd6; --red:#c94040;\n  --glass:rgba(95,179,207,.16); --glass-edge:#4f7280; --chassis:#f4f6f8; --wheel:#4a535d;\n  color-scheme:dark }\n\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--body);font-family:var(--f-display);font-size:16px;line-height:1.5;margin:0}\n.wrap{max-width:1220px;margin:0 auto;padding-inline:20px;padding-block:22px 40px}\nheader{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:16px}\n.brand{font-weight:700;color:var(--ink);font-size:15px}\n.brand span{color:var(--accent)}\nh1{margin:2px 0 0;font-size:clamp(24px,3.2vw,32px);line-height:1.2;color:var(--ink);font-weight:700;text-wrap:balance}\n.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;padding:3px;background:var(--panel);flex-wrap:wrap}\n.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--body);padding:6px 13px;border-radius:7px;cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:var(--bg);font-weight:600}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n\n.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:22px;align-items:start}\n@media (max-width:900px){ .grid{grid-template-columns:minmax(0,1fr)} }\n.col{display:flex;flex-direction:column;gap:14px;min-width:0}\n.card{border:1px solid var(--rule);border-radius:14px;background:var(--panel);padding:16px 18px;min-width:0}\n.field-card{padding:14px}\n.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px}\n\nsvg#field{display:block;width:100%;max-width:640px;margin:0 auto;height:auto;touch-action:manipulation;cursor:crosshair;border-radius:10px;user-select:none;-webkit-user-select:none}\nsvg text{font-family:var(--f-display)}\n.lbl{font-size:21px;font-weight:600;paint-order:stroke;stroke:var(--floor);stroke-width:6px;stroke-linejoin:round}\n.lbl.mono{font-family:var(--f-mono);font-size:19px}\n.axis{font-size:15px;fill:var(--muted);font-family:var(--f-mono)}\n\n.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px;max-width:640px;margin-inline:auto}\n.toolbar label{font-size:14px;color:var(--body);display:inline-flex;align-items:center;gap:6px}\nselect,input[type=number]{font:inherit;font-size:14px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);padding:4px 8px}\ninput[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}\n.hint{font-size:13px;color:var(--muted);margin:10px auto 0;max-width:640px}\n.btns{display:flex;flex-wrap:wrap;gap:6px}\n.btn{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--panel);color:var(--body);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}\n.btn:hover{border-color:var(--accent);color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}\n.btn.primary:hover{filter:brightness(1.08);color:var(--bg)}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n\n.readout{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.big{background:var(--soft);border-radius:10px;padding:10px 12px}\n.big .k{font-size:13px;color:var(--muted)}\n.big .v{font-family:var(--f-mono);font-size:26px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25}\n.big .v small{font-size:14px;color:var(--muted);font-weight:400;margin-left:3px}\n.big.turn .v{color:var(--led)}\n.sub{font-size:13px;color:var(--muted);margin:8px 0 0;font-family:var(--f-mono)}\n\n.steps{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto;margin:0 -4px;padding:0 4px}\n.step{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;align-items:center;padding:6px 8px;border-radius:9px;background:var(--soft);border-left:3px solid transparent}\n.step.on{border-left-color:var(--led);background:var(--led-soft)}\n.step .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center}\n.step label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-width:0}\n.step input{width:100%;min-width:0;font-family:var(--f-mono);font-size:14px;padding:3px 6px;text-align:right}\n.step .tag{grid-column:2/4;font-size:14px;color:var(--ink);font-weight:600}\n.step .x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:6px;line-height:1;padding:3px}\n.step .x:hover{color:var(--red);background:var(--panel)}\n.empty{font-size:14px;color:var(--muted);padding:10px;text-align:center;background:var(--soft);border-radius:9px}\n.totals{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 0;font-family:var(--f-mono)}\n\n.run-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}\n.err{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:2px 10px;align-items:center;margin-top:12px}\n.err label{grid-column:1/-1;font-size:13px;color:var(--body);display:flex;justify-content:space-between}\n.err label span{color:var(--muted);font-family:var(--f-mono);font-size:12px}\n.err input[type=range]{accent-color:var(--led)}\n.err output{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--ink)}\n.result{font-size:14px;margin:10px 0 0;color:var(--ink)}\n.result b{color:var(--led);font-family:var(--f-mono)}\n\npre.code{font-family:var(--f-mono);font-size:12.5px;line-height:1.65;background:var(--soft);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin:10px 0 0;overflow:auto;max-height:340px;color:var(--ink);white-space:pre}\npre.code .c{color:var(--muted)}\n.note{font-size:13px;color:var(--muted);margin:8px 0 0}\n.note.warn{color:var(--led)}\n[hidden]{display:none!important}\n@media (prefers-reduced-motion: reduce){ *{transition:none!important} }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div>\n      <div class=\"brand\">Tap<span>Planner<\/span> · Alvik<\/div>\n      <h1>จิ้มสนามเพื่อวัดระยะ แล้วให้หุ่นเดินตามมุมและระยะ<\/h1>\n    <\/div>\n    <div class=\"seg\" role=\"group\" aria-label=\"โหมดการจิ้ม\">\n      <button data-mode=\"path\" aria-pressed=\"true\">วางเส้นทาง<\/button>\n      <button data-mode=\"measure\" aria-pressed=\"false\">วัดระยะ<\/button>\n      <button data-mode=\"start\" aria-pressed=\"false\">ย้ายจุดเริ่ม<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"grid\">\n    <div class=\"col\">\n      <section class=\"card field-card\" aria-label=\"สนามมองจากด้านบน\">\n        <svg id=\"field\" viewBox=\"-40 -40 880 880\" role=\"img\" aria-label=\"สนาม 80 × 80 เซนติเมตร มองจากด้านบน\"><\/svg>\n        <div class=\"toolbar\">\n          <label>สนาม\n            <select id=\"layout\">\n              <option value=\"0\">แบบที่ 1 • สามเหลี่ยม<\/option>\n              <option value=\"1\">แบบที่ 2 • เรียงด้านขวา<\/option>\n              <option value=\"2\">แบบที่ 3 • กระจาย<\/option>\n            <\/select>\n          <\/label>\n          <label>Snap\n            <select id=\"snap\">\n              <option value=\"cross\">จุดตัดเส้น (ถ้าใกล้)<\/option>\n              <option value=\"10\">ทุก 1 cm<\/option>\n              <option value=\"50\">ทุก 5 cm<\/option>\n              <option value=\"0\">ไม่ snap<\/option>\n            <\/select>\n          <\/label>\n          <label title=\"ถ้าเป้าอยู่ข้างหลัง (|มุม| > 90°) ให้ถอยหลังแทนการหมุนเกือบรอบ\"><input type=\"checkbox\" id=\"reverse\"> ถอยหลังได้<\/label>\n        <\/div>\n        <p class=\"hint\" id=\"hint\"><\/p>\n      <\/section>\n    <\/div>\n\n    <aside class=\"col\">\n      <div class=\"card\">\n        <p class=\"label\" id=\"ro-title\">ถ้าจิ้มตรงนี้<\/p>\n        <div class=\"readout\">\n          <div class=\"big turn\"><div class=\"k\" id=\"ro-k1\">หมุน (+ = ซ้าย)<\/div><div class=\"v\" id=\"ro-v1\">—<\/div><\/div>\n          <div class=\"big\"><div class=\"k\" id=\"ro-k2\">เดิน<\/div><div class=\"v\" id=\"ro-v2\">—<\/div><\/div>\n        <\/div>\n        <p class=\"sub\" id=\"ro-sub\">ชี้หรือจิ้มบนสนาม<\/p>\n        <div class=\"btns\" id=\"start-tools\" hidden style=\"margin-top:10px\">\n          <button class=\"btn\" data-turn=\"90\">⟲ หันซ้าย 90°<\/button>\n          <button class=\"btn\" data-turn=\"-90\">⟳ หันขวา 90°<\/button>\n          <button class=\"btn\" data-turn=\"15\">+15°<\/button>\n          <button class=\"btn\" data-turn=\"-15\">−15°<\/button>\n          <button class=\"btn\" id=\"start-reset\">จุดเริ่มมาตรฐาน<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <p class=\"label\">ลำดับคำสั่ง<\/p>\n        <div class=\"steps\" id=\"steps\"><\/div>\n        <div class=\"totals\"><span id=\"tot-d\">รวมเดิน 0.0 cm<\/span><span id=\"tot-t\">≈ 0.0 วินาที<\/span><\/div>\n        <div class=\"btns\" style=\"margin-top:10px\">\n          <button class=\"btn\" id=\"add-go\">+ เดินเอง<\/button>\n          <button class=\"btn\" id=\"add-lift\">+ ยกแท่น<\/button>\n          <button class=\"btn\" id=\"add-drop\">+ วางแท่น<\/button>\n          <button class=\"btn\" id=\"undo\">ย้อน<\/button>\n          <button class=\"btn\" id=\"clear\">ล้าง<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <p class=\"label\">จำลองการวิ่ง<\/p>\n        <div class=\"run-row\">\n          <button class=\"btn primary\" id=\"run\">▶ รัน<\/button>\n          <button class=\"btn\" id=\"stop\">หยุด<\/button>\n          <label style=\"font-size:14px;display:inline-flex;gap:6px;align-items:center\">ความเร็ว\n            <select id=\"speed\"><option value=\"1\">1×<\/option><option value=\"2\" selected>2×<\/option><option value=\"4\">4×<\/option><\/select>\n          <\/label>\n        <\/div>\n        <div class=\"err\">\n          <label for=\"e-rot\">มุมหมุนจริงคลาด <span>rotate × (1 + e)<\/span><\/label>\n          <input type=\"range\" id=\"e-rot\" min=\"-10\" max=\"10\" step=\"0.5\" value=\"0\"><output id=\"o-rot\">0%<\/output>\n          <label for=\"e-dist\">ระยะเดินจริงคลาด <span>move × (1 + e)<\/span><\/label>\n          <input type=\"range\" id=\"e-dist\" min=\"-10\" max=\"10\" step=\"0.5\" value=\"0\"><output id=\"o-dist\">0%<\/output>\n        <\/div>\n        <p class=\"result\" id=\"result\">เส้นสีส้มประคือทางที่หุ่นจะวิ่งจริงเมื่อมีความคลาดเคลื่อน ลองตั้งค่าแล้วดูว่าปลายทางเลื่อนไปเท่าไร<\/p>\n      <\/div>\n\n      <div class=\"card\">\n        <p class=\"label\">โค้ด Arduino_Alvik<\/p>\n        <div class=\"run-row\">\n          <div class=\"seg\" role=\"group\" aria-label=\"รูปแบบโค้ด\">\n            <button data-codemode=\"cmds\" aria-pressed=\"true\">แค่คำสั่ง<\/button>\n            <button data-codemode=\"sketch\" aria-pressed=\"false\">sketch เต็ม<\/button>\n          <\/div>\n          <button class=\"btn\" id=\"copy\">คัดลอก<\/button>\n          <button class=\"btn\" id=\"to-arena\" hidden>ส่งไปรันในสนาม C++<\/button>\n        <\/div>\n        <pre class=\"code\" id=\"code\"><\/pre>\n        <p class=\"note\" id=\"arena-note\" hidden><\/p>\n      <\/div>\n    <\/aside>\n  <\/div>\n<\/div>\n\n<script>\n// ===== สนามเดียวกับหน้า \"สนามยก–จอดแท่น\" (หน่วย mm, origin มุมซ้ายบน, y ลงล่าง) =====\nconst FIELD = 800, LINES = [96,248,400,552,704], LINE_HALF = 12, LINE_MIN = 84, LINE_MAX = 716;\nconst LAYOUTS = [ [[248,552],[400,400],[552,552]], [[704,248],[704,400],[704,552]], [[248,96],[552,248],[248,552]] ];\nconst ZONES = [96,400,704].map(x => ({x:x-70, y:28, w:140, h:140}));\nconst START_ZONE = {x:300, y:600, w:200, h:200};\nconst START_DEFAULT = {x:400, y:716, th:0};       // th: rad, 0 = หันขึ้น, + = หมุนซ้าย (ทวนเข็ม)\nconst MOVE_SPEED = 100, ROT_SPEED = 100, SERVO_T = 0.6;   // mm/s, °/s, s (เท่ากับในสนาม C++)\nconst PLAT_HALF = 60, LEG = 12, PICK_R = 45;\nconst LIFT_UP = 90, LIFT_DOWN = 0;\nconst DEG = Math.PI/180;\n\nconst $ = id => document.getElementById(id);\nconst svg = $('field');\nconst NS = 'http://www.w3.org/2000/svg';\nconst inHub = window.parent !== window;\n\n// ===== state =====\nconst S = {\n  mode:'path', layout:0, snap:'cross', reverse:false, codeMode:'cmds',\n  start:{...START_DEFAULT}, steps:[], measure:[], hover:null,\n  err:{rot:0, dist:0}, speed:2, run:null,\n};\ntry {\n  const saved = JSON.parse(localStorage.getItem('alvik-tap-planner-v1') || 'null');\n  if (saved && Array.isArray(saved.steps)) Object.assign(S, {steps:saved.steps, start:saved.start||S.start, layout:saved.layout|0, snap:saved.snap||'cross', reverse:!!saved.reverse});\n} catch(e){}\nfunction save(){ try { localStorage.setItem('alvik-tap-planner-v1', JSON.stringify({steps:S.steps, start:S.start, layout:S.layout, snap:S.snap, reverse:S.reverse})); } catch(e){} }\n\n// ===== math =====\nconst wrap180 = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a === -180 ? 180 : a; };\nconst r1 = v => Math.round(v*10)/10;\nconst fwd = th => [-Math.sin(th), -Math.cos(th)];\nconst sgn = (v, d=1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);\nconst cm = mm => (mm/10).toFixed(1);\nfunction bearing(dx, dy){ return Math.atan2(-dx, -dy); }   // มุมทิศ (rad) แบบเดียวกับ th\n\nfunction snapPt(x, y){\n  x = Math.max(0, Math.min(FIELD, x)); y = Math.max(0, Math.min(FIELD, y));\n  if (S.snap === 'cross'){\n    let best = null, bd = 50;\n    for (const cx of LINES) for (const cy of LINES){ const d = Math.hypot(x-cx, y-cy); if (d < bd){ bd = d; best = [cx, cy]; } }\n    if (best) return {x:best[0], y:best[1], snapped:true};\n    return {x:Math.round(x/10)*10, y:Math.round(y/10)*10};\n  }\n  const g = +S.snap;\n  if (!g) return {x:Math.round(x), y:Math.round(y)};\n  return {x:Math.round(x/g)*g, y:Math.round(y/g)*g};\n}\n\n// คำสั่งจาก pose → จุดเป้า\nfunction cmdTo(pose, pt){\n  const dx = pt.x - pose.x, dy = pt.y - pose.y, d = Math.hypot(dx, dy);\n  if (d < 0.5) return {rot:0, dist:0};\n  let rot = wrap180((bearing(dx, dy) - pose.th) / DEG), dist = d/10;\n  if (S.reverse && Math.abs(rot) > 90){ rot = wrap180(rot - 180*Math.sign(rot)); dist = -dist; }\n  return {rot:r1(rot), dist:r1(dist)};\n}\n\n// ===== แปลง steps → timeline (พร้อม error) =====\nfunction initialPlats(){ return LAYOUTS[S.layout].map(([x,y], i) => ({id:i, x, y, a:0})); }\nfunction buildPlan(err){\n  const phases = []; let p = {...S.start}; const verts = [{...p}];\n  S.steps.forEach((s, i) => {\n    if (s.type === 'go'){\n      if (Math.abs(s.rot) > 1e-6) phases.push({i, k:'rot', dur:Math.abs(s.rot)/ROT_SPEED, v:s.rot*(1+err.rot)*DEG});\n      if (Math.abs(s.dist) > 1e-6) phases.push({i, k:'move', dur:Math.abs(s.dist*10)/MOVE_SPEED, v:s.dist*10*(1+err.dist)});\n    } else phases.push({i, k:s.type, dur:SERVO_T});\n  });\n  let T = 0; for (const ph of phases){ ph.t0 = T; T += ph.dur; }\n  return {phases, T};\n}\n// สถานะ ณ เวลา t (replay ตั้งแต่ต้น: steps น้อย จึงเร็วพอ)\nfunction stateAt(plan, t){\n  const pose = {...S.start}, plats = initialPlats(); let held = null, cur = -1;\n  // แท่นที่ยกอยู่ขยับตามหุ่น: เก็บ offset ในกรอบหุ่น (ly = ข้างหน้า, lx = ทางขวา)\n  const carry = () => { if (!held) return; const [fx, fy] = fwd(pose.th), rx = -fy, ry = fx;\n    held.p.x = pose.x + fx*held.ly + rx*held.lx; held.p.y = pose.y + fy*held.ly + ry*held.lx;\n    held.p.a = held.a0 + (pose.th - held.th0); };\n  for (const ph of plan.phases){\n    if (t <= ph.t0) break;\n    const f = Math.min(1, (t - ph.t0) / (ph.dur || 1)); cur = ph.i;\n    if (ph.k === 'rot'){ pose.th += ph.v * f; carry(); }\n    else if (ph.k === 'move'){ const [fx, fy] = fwd(pose.th); pose.x += fx*ph.v*f; pose.y += fy*ph.v*f; carry(); }\n    else if (f >= 1 && ph.k === 'lift' && !held){\n      let best = null, bd = PICK_R;\n      for (const q of plats){ const d = Math.hypot(q.x-pose.x, q.y-pose.y); if (d < bd){ bd = d; best = q; } }\n      if (best){ const [fx, fy] = fwd(pose.th), dx = best.x-pose.x, dy = best.y-pose.y;\n        held = {p:best, ly:dx*fx + dy*fy, lx:dx*(-fy) + dy*fx, a0:best.a, th0:pose.th}; }\n    }\n    else if (f >= 1 && ph.k === 'drop' && held){ held = null; }\n  }\n  return {pose, plats, held:!!held, cur};\n}\n// จุดยอดของเส้นทาง (หลังแต่ละ step) เพื่อวาด\nfunction vertices(err){\n  const plan = buildPlan(err), out = [{...S.start, i:-1}];\n  let t = 0;\n  S.steps.forEach((s, i) => {\n    t = plan.phases.filter(ph => ph.i <= i).reduce((m, ph) => Math.max(m, ph.t0 + ph.dur), t);\n    out.push({...stateAt(plan, t + 1e-9).pose, i});\n  });\n  return out;\n}\n\n// ===== drawing =====\nconst el = (tag, attrs={}, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };\nconst layers = {};\n['floor','plats','plan','actual','marks','robot','preview'].forEach(n => { layers[n] = el('g', {id:'L-'+n}); svg.appendChild(layers[n]); });\nlayers.preview.setAttribute('pointer-events','none'); layers.marks.setAttribute('pointer-events','none');\n\nfunction drawFloor(){\n  const g = layers.floor; g.innerHTML = '';\n  g.appendChild(el('rect', {x:-40, y:-40, width:880, height:880, fill:'var(--panel)'}));\n  g.appendChild(el('rect', {x:0, y:0, width:FIELD, height:FIELD, rx:6, fill:'var(--floor)', stroke:'var(--muted)', 'stroke-width':2}));\n  for (let v = 50; v < FIELD; v += 50) {\n    g.appendChild(el('line', {x1:v, y1:0, x2:v, y2:FIELD, stroke:'var(--grid)', 'stroke-width':v % 100 ? 1 : 2}));\n    g.appendChild(el('line', {x1:0, y1:v, x2:FIELD, y2:v, stroke:'var(--grid)', 'stroke-width':v % 100 ? 1 : 2}));\n  }\n  for (const z of ZONES) g.appendChild(el('rect', {x:z.x, y:z.y, width:z.w, height:z.h, fill:'var(--blue)', opacity:.85}));\n  const s = START_ZONE; g.appendChild(el('rect', {x:s.x, y:s.y, width:s.w, height:s.h, fill:'var(--red)', opacity:.85}));\n  for (const v of LINES){\n    g.appendChild(el('rect', {x:v-LINE_HALF, y:LINE_MIN, width:LINE_HALF*2, height:LINE_MAX-LINE_MIN, fill:'var(--tape)'}));\n    g.appendChild(el('rect', {x:LINE_MIN, y:v-LINE_HALF, width:LINE_MAX-LINE_MIN, height:LINE_HALF*2, fill:'var(--tape)'}));\n  }\n  for (let v = 0; v <= FIELD; v += 100){\n    g.appendChild(el('text', {x:v, y:-14, 'text-anchor':'middle', class:'axis'}, v/10));\n    g.appendChild(el('text', {x:-12, y:v+5, 'text-anchor':'end', class:'axis'}, v/10));\n  }\n  g.appendChild(el('text', {x:FIELD, y:FIELD+30, 'text-anchor':'end', class:'axis'}, 'cm'));\n}\n\nfunction platNode(q, ghost){\n  const g = el('g', {transform:`translate(${q.x} ${q.y}) rotate(${-q.a/DEG})`, opacity: ghost ? .55 : 1});\n  g.appendChild(el('rect', {x:-PLAT_HALF, y:-PLAT_HALF, width:PLAT_HALF*2, height:PLAT_HALF*2, rx:4, fill:ghost?'none':'var(--glass)', stroke:'var(--glass-edge)', 'stroke-width':2.5, 'stroke-dasharray':ghost?'8 6':'none'}));\n  for (const sx of [-1,1]) for (const sy of [-1,1]) g.appendChild(el('rect', {x:sx*(PLAT_HALF-LEG/2)-LEG/2, y:sy*(PLAT_HALF-LEG/2)-LEG/2, width:LEG, height:LEG, fill:'var(--glass-edge)'}));\n  return g;\n}\nfunction robotNode(p, opts={}){\n  const g = el('g', {transform:`translate(${p.x} ${p.y}) rotate(${-p.th/DEG})`, opacity:opts.ghost ? .45 : 1});\n  g.appendChild(el('rect', {x:-52, y:-22, width:10, height:44, rx:3, fill:'var(--wheel)'}));\n  g.appendChild(el('rect', {x:42, y:-22, width:10, height:44, rx:3, fill:'var(--wheel)'}));\n  g.appendChild(el('rect', {x:-43, y:-48, width:86, height:94, rx:12, fill:'var(--chassis)', 'fill-opacity':.9, stroke:'var(--ink)', 'stroke-width':2.5, 'stroke-dasharray':opts.ghost?'7 5':'none'}));\n  g.appendChild(el('path', {d:'M0 -60 L-11 -42 L11 -42 Z', fill:opts.color||'var(--accent)'}));\n  for (const sx of [-14,0,14]) g.appendChild(el('circle', {cx:sx, cy:-36, r:4, fill:'var(--muted)'}));\n  g.appendChild(el('circle', {cx:0, cy:0, r:4.5, fill:opts.color||'var(--accent)'}));\n  return g;\n}\nfunction arcPath(c, th0, rotDeg, R){\n  const [ax, ay] = fwd(th0), [bx, by] = fwd(th0 + rotDeg*DEG);\n  const sweep = rotDeg > 0 ? 0 : 1, large = Math.abs(rotDeg) > 180 ? 1 : 0;\n  return `M${c.x+ax*R} ${c.y+ay*R} A${R} ${R} 0 ${large} ${sweep} ${c.x+bx*R} ${c.y+by*R}`;\n}\nfunction label(g, x, y, txt, color, mono){\n  g.appendChild(el('text', {x, y, 'text-anchor':'middle', 'dominant-baseline':'middle', class:'lbl'+(mono?' mono':''), fill:color}, txt));\n}\n\nfunction drawPlan(){\n  const P = layers.plan, A = layers.actual, M = layers.marks; P.innerHTML = A.innerHTML = M.innerHTML = '';\n  const V = vertices({rot:0, dist:0});\n  // เส้นทางตามคำสั่ง\n  if (V.length > 1){\n    P.appendChild(el('polyline', {points:V.map(v => `${v.x},${v.y}`).join(' '), fill:'none', stroke:'var(--accent)', 'stroke-width':5, 'stroke-linejoin':'round', 'stroke-linecap':'round'}));\n  }\n  // เส้นทางจริงถ้ามี error\n  const E = {rot:S.err.rot/100, dist:S.err.dist/100};\n  if ((E.rot || E.dist) && V.length > 1){\n    const VA = vertices(E);\n    A.appendChild(el('polyline', {points:VA.map(v => `${v.x},${v.y}`).join(' '), fill:'none', stroke:'var(--led)', 'stroke-width':4, 'stroke-dasharray':'10 8', 'stroke-linejoin':'round'}));\n    const e = VA[VA.length-1], v = V[V.length-1];\n    A.appendChild(el('circle', {cx:e.x, cy:e.y, r:7, fill:'var(--led)'}));\n    $('result').innerHTML = `ปลายทางจริงคลาดจากแผน <b>${cm(Math.hypot(e.x-v.x, e.y-v.y))} cm<\/b> และหันเพี้ยน <b>${sgn(wrap180((e.th-v.th)/DEG))}°<\/b>`;\n  } else {\n    $('result').textContent = 'เส้นสีส้มประคือทางที่หุ่นจะวิ่งจริงเมื่อมีความคลาดเคลื่อน ลองตั้งค่าแล้วดูว่าปลายทางเลื่อนไปเท่าไร';\n  }\n  // ป้ายกำกับ: มุมหมุนที่จุดยอด, ระยะกลางเส้น, หมายเลข step\n  const stack = {};\n  S.steps.forEach((s, i) => {\n    const a = V[i], b = V[i+1];\n    if (s.type === 'go'){\n      if (Math.abs(s.rot) >= 0.5){\n        M.appendChild(el('path', {d:arcPath(a, a.th, s.rot, 34), fill:'none', stroke:'var(--led)', 'stroke-width':3.5}));\n        const [mx, my] = fwd(a.th + s.rot*DEG/2);\n        label(M, a.x + mx*62, a.y + my*62, sgn(s.rot)+'°', 'var(--led)', true);\n      }\n      if (Math.abs(s.dist) >= 0.5){\n        const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, [nx, ny] = fwd(b.th);\n        label(M, mx + ny*38, my - nx*38, (s.dist < 0 ? '◀ ' : '') + Math.abs(s.dist).toFixed(1), 'var(--accent)', true);\n      }\n    } else {\n      // ยก/วางไม่ขยับหุ่น → ไม่วาดหมุดซ้อน ใช้ป้ายข้างจุดแทน (เรียงลงถ้ามีหลายอันที่จุดเดียวกัน)\n      const k = stack[`${Math.round(b.x)},${Math.round(b.y)}`] = (stack[`${Math.round(b.x)},${Math.round(b.y)}`] || 0) + 1;\n      label(M, b.x + 78, b.y - 24 + k*26, `${i+1} ${s.type === 'lift' ? '▲ ยก' : '▼ วาง'}`, 'var(--ink)');\n      return;\n    }\n    M.appendChild(el('circle', {cx:b.x, cy:b.y, r:12, fill:'var(--panel)', stroke:'var(--accent)', 'stroke-width':3}));\n    M.appendChild(el('text', {x:b.x, y:b.y+1, 'text-anchor':'middle', 'dominant-baseline':'middle', style:'font-size:14px;font-weight:700;font-family:var(--f-mono)', fill:'var(--accent)'}, i+1));\n  });\n}\n\nfunction drawDynamic(){\n  const G = layers.plats, R = layers.robot; G.innerHTML = R.innerHTML = '';\n  const err = {rot:S.err.rot/100, dist:S.err.dist/100};\n  if (S.run){\n    const st = stateAt(S.run.plan, S.run.t);\n    st.plats.forEach(q => G.appendChild(platNode(q)));\n    if (S.run.trail.length > 1) R.appendChild(el('polyline', {points:S.run.trail.map(p => p.join(',')).join(' '), fill:'none', stroke:'var(--led)', 'stroke-width':3}));\n    R.appendChild(robotNode(st.pose, {color:'var(--led)'}));\n    markStep(st.cur);\n  } else {\n    const plan = buildPlan({rot:0, dist:0}), end = stateAt(plan, plan.T + 1);\n    const init = initialPlats();\n    init.forEach(q => G.appendChild(platNode(q)));\n    end.plats.forEach((q, i) => { if (Math.hypot(q.x-init[i].x, q.y-init[i].y) > 1 || Math.abs(q.a) > 1e-3) G.appendChild(platNode(q, true)); });\n    if (S.steps.length) R.appendChild(robotNode(end.pose, {ghost:true}));\n    R.appendChild(robotNode(S.start));\n    markStep(-1);\n  }\n}\n\nfunction lastPose(){ const V = vertices({rot:0, dist:0}); return V[V.length-1]; }\n\nfunction drawPreview(){\n  const g = layers.preview; g.innerHTML = '';\n  if (S.mode === 'measure'){\n    const pts = [...S.measure]; if (pts.length === 1 && S.hover) pts.push(S.hover);\n    pts.forEach(p => g.appendChild(el('circle', {cx:p.x, cy:p.y, r:8, fill:'var(--led)'})));\n    if (pts.length === 2){\n      const [a, b] = pts;\n      g.appendChild(el('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:'var(--led)', 'stroke-width':4, 'stroke-dasharray':S.measure.length === 2 ? 'none' : '10 7'}));\n      label(g, (a.x+b.x)/2, (a.y+b.y)/2 - 24, cm(Math.hypot(b.x-a.x, b.y-a.y)) + ' cm', 'var(--led)', true);\n    }\n    return;\n  }\n  if (!S.hover || S.run) return;\n  if (S.mode === 'start'){ g.appendChild(robotNode({...S.start, x:S.hover.x, y:S.hover.y}, {ghost:true})); return; }\n  const p = lastPose(), c = cmdTo(p, S.hover);\n  g.appendChild(el('line', {x1:p.x, y1:p.y, x2:S.hover.x, y2:S.hover.y, stroke:'var(--accent)', 'stroke-width':4, 'stroke-dasharray':'10 8', opacity:.8}));\n  g.appendChild(el('circle', {cx:S.hover.x, cy:S.hover.y, r:9, fill:'none', stroke:'var(--accent)', 'stroke-width':3}));\n  if (Math.abs(c.rot) >= 0.5) g.appendChild(el('path', {d:arcPath(p, p.th, c.rot, 34), fill:'none', stroke:'var(--led)', 'stroke-width':3, opacity:.8}));\n}\n\n// ===== readout panel =====\nfunction readout(){\n  const t = $('ro-title'), k1 = $('ro-k1'), k2 = $('ro-k2'), v1 = $('ro-v1'), v2 = $('ro-v2'), sub = $('ro-sub');\n  $('start-tools').hidden = S.mode !== 'start';\n  if (S.mode === 'measure'){\n    t.textContent = 'วัดระยะ A → B'; k1.textContent = 'ทิศ A→B (+ = ซ้ายของแนวขึ้น)'; k2.textContent = 'ระยะ';\n    const pts = [...S.measure]; if (pts.length === 1 && S.hover) pts.push(S.hover);\n    if (pts.length === 2){\n      const [a, b] = pts, dx = b.x-a.x, dy = b.y-a.y;\n      v1.innerHTML = sgn(r1(wrap180(bearing(dx, dy)/DEG))) + '<small>°<\/small>';\n      v2.innerHTML = cm(Math.hypot(dx, dy)) + '<small>cm<\/small>';\n      sub.textContent = `A (${cm(a.x)}, ${cm(a.y)})  B (${cm(b.x)}, ${cm(b.y)})  Δx ${sgn(r1(dx/10))}  Δy ${sgn(r1(dy/10))} cm`;\n    } else { v1.textContent = v2.textContent = '—'; sub.textContent = pts.length ? `A (${cm(pts[0].x)}, ${cm(pts[0].y)}) · จิ้มจุด B` : 'จิ้มจุด A แล้วจุด B'; }\n    return;\n  }\n  if (S.mode === 'start'){\n    t.textContent = 'จุดเริ่มของหุ่น'; k1.textContent = 'หันหน้า (0 = ขึ้น, + = ซ้าย)'; k2.textContent = 'ตำแหน่ง x, y';\n    v1.innerHTML = sgn(r1(wrap180(S.start.th/DEG))) + '<small>°<\/small>';\n    v2.innerHTML = `${cm(S.start.x)}, ${cm(S.start.y)}<small>cm<\/small>`;\n    sub.textContent = 'จิ้มบนสนามเพื่อย้ายจุดหมุนของหุ่น (กึ่งกลางล้อ)';\n    return;\n  }\n  const p = lastPose();\n  t.textContent = S.steps.length ? `ถ้าจิ้มตรงนี้ (ต่อจาก step ${S.steps.length})` : 'ถ้าจิ้มตรงนี้ (จากจุดเริ่ม)';\n  k1.textContent = 'หมุน (+ = ซ้าย)'; k2.textContent = 'เดิน';\n  if (S.hover){\n    const c = cmdTo(p, S.hover);\n    v1.innerHTML = sgn(c.rot) + '<small>°<\/small>'; v2.innerHTML = c.dist.toFixed(1) + '<small>cm<\/small>';\n    sub.textContent = `เป้า (${cm(S.hover.x)}, ${cm(S.hover.y)}) cm${S.hover.snapped ? ' · snap จุดตัด' : ''}`;\n  } else { v1.textContent = v2.textContent = '—'; sub.textContent = `หุ่นอยู่ที่ (${cm(p.x)}, ${cm(p.y)}) cm หัน ${sgn(r1(wrap180(p.th/DEG)))}°`; }\n}\n\n// ===== steps list =====\nfunction renderSteps(){\n  const box = $('steps'); box.innerHTML = '';\n  if (!S.steps.length){ box.innerHTML = '<div class=\"empty\">ยังไม่มีคำสั่ง · จิ้มบนสนามเพื่อเพิ่ม<\/div>'; }\n  S.steps.forEach((s, i) => {\n    const row = document.createElement('div'); row.className = 'step'; row.dataset.i = i;\n    if (s.type === 'go'){\n      row.innerHTML = `<span class=\"n\">${i+1}<\/span>\n        <label>หมุน<input type=\"number\" step=\"0.5\" value=\"${s.rot}\" data-k=\"rot\" aria-label=\"step ${i+1} หมุน องศา\">°<\/label>\n        <label>เดิน<input type=\"number\" step=\"0.5\" value=\"${s.dist}\" data-k=\"dist\" aria-label=\"step ${i+1} เดิน เซนติเมตร\">cm<\/label>\n        <button class=\"x\" aria-label=\"ลบ step ${i+1}\">×<\/button>`;\n    } else {\n      row.innerHTML = `<span class=\"n\">${i+1}<\/span><span class=\"tag\">${s.type === 'lift' ? '▲ ยกแท่น' : '▼ วางแท่น'}<\/span><button class=\"x\" aria-label=\"ลบ step ${i+1}\">×<\/button>`;\n    }\n    row.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {\n      const v = parseFloat(inp.value); s[inp.dataset.k] = isNaN(v) ? 0 : r1(inp.dataset.k === 'rot' ? wrap180(v) : v); update(); }));\n    row.querySelector('.x').addEventListener('click', () => { S.steps.splice(i, 1); update(); });\n    box.appendChild(row);\n  });\n  const plan = buildPlan({rot:0, dist:0});\n  const d = S.steps.reduce((m, s) => m + (s.type === 'go' ? Math.abs(s.dist) : 0), 0);\n  $('tot-d').textContent = `รวมเดิน ${d.toFixed(1)} cm · ${S.steps.length} step`;\n  $('tot-t').textContent = `≈ ${plan.T.toFixed(1)} วินาที`;\n}\nfunction markStep(i){ document.querySelectorAll('.step').forEach(r => r.classList.toggle('on', +r.dataset.i === i)); }\n\n// ===== code =====\nfunction codeLines(indent){\n  const L = [];\n  S.steps.forEach((s, i) => {\n    if (s.type === 'go'){\n      if (Math.abs(s.rot) > 1e-6) L.push([`alvik.rotate(${s.rot.toFixed(1)});`, `${i+1}: หมุน (+ = ซ้าย)`]);\n      if (Math.abs(s.dist) > 1e-6) L.push([`alvik.move(${s.dist.toFixed(1)});`, `${i+1}: ${s.dist < 0 ? 'ถอย' : 'เดิน'} [cm]`]);\n    } else {\n      L.push([indent ? `alvik.set_servo_positions(${s.type === 'lift' ? 'LIFT_UP' : 'LIFT_DOWN'}, 0);` : `alvik.set_servo_positions(${s.type === 'lift' ? LIFT_UP : LIFT_DOWN}, 0);`, `${i+1}: ${s.type === 'lift' ? 'ยกแท่น' : 'วางแท่น'}`]);\n      L.push(['delay(500);', '']);\n    }\n  });\n  const w = Math.max(24, ...L.map(l => l[0].length + 2));\n  return L.map(([c, k]) => indent + (k ? c.padEnd(w) + '// ' + k : c));\n}\nfunction codeText(){\n  const st = `จุดเริ่ม (${cm(S.start.x)}, ${cm(S.start.y)}) cm หัน ${sgn(r1(wrap180(S.start.th/DEG)))}°`;\n  if (S.codeMode === 'cmds'){\n    const L = codeLines('');\n    return `// สร้างจาก Tap Planner · ${st}\\n` + (L.length ? L.join('\\n') : '// ยังไม่มีคำสั่ง');\n  }\n  return `// สร้างจาก Tap Planner · ${st}\n#include \"Arduino_Alvik.h\"\nArduino_Alvik alvik;\n\nconst int LIFT_UP   = ${LIFT_UP};    // มุมเซอร์โว A ตอนยก\nconst int LIFT_DOWN = ${LIFT_DOWN};     // มุมเซอร์โว A ตอนลง\n\nvoid setup() {\n  Serial.begin(115200);\n  alvik.begin();\n  alvik.set_servo_positions(LIFT_DOWN, 0);\n\n  // รอกด OK แล้วปล่อย\n  while (!alvik.get_touch_ok()) delay(10);\n  while ( alvik.get_touch_ok()) delay(10);\n\n  // move() / rotate() เป็น blocking: รอจนทำเสร็จก่อนไปบรรทัดถัดไป\n${codeLines('  ').join('\\n') || '  // ยังไม่มีคำสั่ง'}\n\n  alvik.brake();\n  Serial.println(\"เสร็จ\");\n}\n\nvoid loop() {}\n`;\n}\nfunction renderCode(){\n  const esc = s => s.replace(/&/g,'&amp;').replace(/<\/g,'&lt;');\n  $('code').innerHTML = esc(codeText()).replace(/(\\/\\/[^\\n]*)/g, '<span class=\"c\">$1<\/span>');\n  document.querySelectorAll('[data-codemode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.codemode === S.codeMode));\n  const atStd = Math.hypot(S.start.x-START_DEFAULT.x, S.start.y-START_DEFAULT.y) < 1 && Math.abs(wrap180(S.start.th/DEG)) < 0.05;\n  $('to-arena').hidden = !inHub;\n  const note = $('arena-note');\n  note.hidden = !inHub;\n  note.className = 'note' + (atStd ? '' : ' warn');\n  note.textContent = atStd\n    ? 'กดแล้วจะเปิดหน้าสนามยก–จอดแท่น ใส่ sketch เต็มนี้ เลือกสนามเดียวกัน แล้วรันให้ดูเลย'\n    : 'ในสนาม C++ หุ่นเริ่มที่จุดเริ่มมาตรฐาน (40.0, 71.6) cm หัน 0° เสมอ ถ้าส่งไปตอนนี้ เส้นทางจะเลื่อนจากที่วางไว้';\n}\n\n// ===== run =====\nlet raf = 0, prevT = null;\nfunction startRun(){\n  if (!S.steps.length) return;\n  S.run = {plan:buildPlan({rot:S.err.rot/100, dist:S.err.dist/100}), t:0, trail:[[S.start.x, S.start.y]]};\n  $('run').textContent = '▶ รันใหม่'; prevT = null; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);\n}\nfunction stopRun(){ cancelAnimationFrame(raf); S.run = null; $('run').textContent = '▶ รัน'; drawDynamic(); }\nfunction tick(ts){\n  if (!S.run) return;\n  if (prevT === null) prevT = ts;\n  const dt = Math.min(0.05, (ts - prevT)/1000) * S.speed; prevT = ts;\n  S.run.t = Math.min(S.run.plan.T, S.run.t + dt);\n  const p = stateAt(S.run.plan, S.run.t).pose, last = S.run.trail[S.run.trail.length-1];\n  if (Math.hypot(p.x-last[0], p.y-last[1]) > 3) S.run.trail.push([p.x, p.y]);\n  drawDynamic();\n  if (S.run.t < S.run.plan.T) raf = requestAnimationFrame(tick);\n  else { S.run.trail.push([p.x, p.y]); drawDynamic(); markStep(-1); $('run').textContent = '▶ รันอีกครั้ง'; }\n}\n\n// ===== update all =====\nfunction update(){\n  if (S.run){ cancelAnimationFrame(raf); S.run = null; $('run').textContent = '▶ รัน'; }\n  save(); renderSteps(); drawPlan(); drawDynamic(); drawPreview(); readout(); renderCode();\n}\nfunction setMode(m){\n  S.mode = m; S.hover = null; if (m !== 'measure') S.measure = [];\n  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));\n  $('hint').textContent = {\n    path: 'จิ้มจุดที่อยากให้หุ่นไป แต่ละครั้งจะได้ rotate + move ต่อจากตำแหน่งล่าสุด · แก้ตัวเลขในรายการได้ · Backspace = ย้อน',\n    measure: 'จิ้ม 2 จุดเพื่อวัดระยะและทิศ (ไม่เพิ่มคำสั่ง) · จิ้มครั้งที่ 3 เริ่มวัดใหม่',\n    start: 'จิ้มเพื่อวางหุ่น แล้วใช้ปุ่มด้านขวาหมุนทิศเริ่มต้น',\n  }[m];\n  drawPreview(); readout();\n}\n\n// ===== input =====\nfunction toField(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return {x:q.x, y:q.y}; }\nsvg.addEventListener('pointermove', ev => { if (ev.pointerType === 'touch') return; const q = toField(ev); S.hover = snapPt(q.x, q.y); drawPreview(); readout(); });\nsvg.addEventListener('pointerleave', () => { S.hover = null; drawPreview(); readout(); });\nsvg.addEventListener('click', ev => {\n  const q = toField(ev), pt = snapPt(q.x, q.y);\n  if (S.mode === 'path'){\n    const c = cmdTo(lastPose(), pt);\n    if (c.dist === 0 && c.rot === 0) return;\n    S.steps.push({type:'go', rot:c.rot, dist:c.dist}); S.hover = pt; update();\n  } else if (S.mode === 'measure'){\n    if (S.measure.length >= 2) S.measure = [];\n    S.measure.push(pt); drawPreview(); readout();\n  } else {\n    S.start = {...S.start, x:pt.x, y:pt.y}; update();\n  }\n});\naddEventListener('keydown', ev => {\n  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;\n  if ((ev.key === 'Backspace' || (ev.key === 'z' && (ev.ctrlKey || ev.metaKey))) && S.steps.length){ ev.preventDefault(); S.steps.pop(); update(); }\n  if (ev.key === 'Escape'){ S.measure = []; drawPreview(); readout(); }\n});\n\ndocument.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));\ndocument.querySelectorAll('[data-turn]').forEach(b => b.addEventListener('click', () => { S.start.th = wrap180(S.start.th/DEG + +b.dataset.turn) * DEG; update(); }));\n$('start-reset').onclick = () => { S.start = {...START_DEFAULT}; update(); };\n$('layout').onchange = e => { S.layout = +e.target.value; update(); };\n$('snap').onchange = e => { S.snap = e.target.value; save(); };\n$('reverse').onchange = e => { S.reverse = e.target.checked; save(); drawPreview(); readout(); };\n$('add-go').onclick = () => { S.steps.push({type:'go', rot:0, dist:10}); update(); };\n$('add-lift').onclick = () => { S.steps.push({type:'lift'}); update(); };\n$('add-drop').onclick = () => { S.steps.push({type:'drop'}); update(); };\n$('undo').onclick = () => { S.steps.pop(); update(); };\n$('clear').onclick = () => { S.steps = []; update(); };\n$('run').onclick = startRun;\n$('stop').onclick = stopRun;\n$('speed').onchange = e => { S.speed = +e.target.value; };\n[['e-rot','o-rot','rot'],['e-dist','o-dist','dist']].forEach(([i,o,k]) => $(i).addEventListener('input', e => { S.err[k] = +e.target.value; $(o).textContent = (S.err[k] > 0 ? '+' : '') + S.err[k] + '%'; drawPlan(); }));\ndocument.querySelectorAll('[data-codemode]').forEach(b => b.addEventListener('click', () => { S.codeMode = b.dataset.codemode; renderCode(); }));\n$('copy').onclick = () => {\n  const t = codeText(), btn = $('copy');\n  const done = () => { btn.textContent = 'คัดลอกแล้ว'; setTimeout(() => btn.textContent = 'คัดลอก', 1500); };\n  const sel = () => { const r = document.createRange(); r.selectNodeContents($('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'กด Ctrl+C'; setTimeout(() => btn.textContent = 'คัดลอก', 2500); };\n  try { navigator.clipboard.writeText(t).then(done, sel); } catch(e){ sel(); }\n};\n$('to-arena').onclick = () => {\n  const keep = S.codeMode; S.codeMode = 'sketch'; const code = codeText(); S.codeMode = keep;\n  window.parent.postMessage({type:'alvik-hub:run-in-arena', code, layout:S.layout}, '*');\n};\n\n// ===== init =====\n$('layout').value = S.layout; $('snap').value = S.snap; $('reverse').checked = S.reverse;\ndrawFloor(); setMode('path'); update();\n<\/script>\n<\/body>\n<\/html>\n"</script>
<button class="icon-btn exit-present" id="exit-present" type="button" hidden>ออกจากโหมดนำเสนอ <kbd>Esc</kbd></button>
<style>.exit-present[hidden]{display:none}.exit-present{position:fixed;top:10px;right:10px;z-index:5;background:var(--bar);opacity:.55}.exit-present:hover,.exit-present:focus-visible{opacity:1}</style>
<script>
// แต่ละหน้าอยู่ใน iframe ของตัวเอง → CSS / id / ตัวแปรไม่ชนกัน และสลับไปมาแล้ว state ไม่หาย
const PAGES = ['arena','tap','linetrack'];
const NAMES = {arena:'สนามแข่ง C++', tap:'Tap Planner', linetrack:'LineTrack'};
const frames = {};
function ensure(name){
  if (frames[name]) return frames[name];
  const f = document.createElement('iframe');
  f.id = 'f-' + name; f.setAttribute('role','tabpanel'); f.setAttribute('aria-labelledby','tab-' + name);
  f.title = NAMES[name];
  f.srcdoc = JSON.parse(document.getElementById('page-' + name).textContent);
  document.getElementById('stage').appendChild(f);
  return frames[name] = f;
}
function show(name, push){
  if (!PAGES.includes(name)) name = 'arena';
  const f = ensure(name);
  PAGES.forEach(p => {
    const t = document.getElementById('tab-' + p);
    t.setAttribute('aria-selected', p === name);
    t.tabIndex = p === name ? 0 : -1;
    if (frames[p]) frames[p].classList.toggle('on', p === name);
  });
  document.title = NAMES[name] + ' · Alvik Sim Hub';
  try { f.contentWindow && f.contentWindow.dispatchEvent(new Event('resize')); } catch(e){}
  try { localStorage.setItem('alvik-sim-hub-page', name); } catch(e){}
  if (push) history.replaceState(null, '', '#' + name);
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => show(b.dataset.page, true)));
document.querySelector('.tabs').addEventListener('keydown', e => {
  const keys = {ArrowLeft:-1, ArrowRight:1, Home:'first', End:'last'};
  if (!(e.key in keys)) return;
  e.preventDefault();
  const cur = PAGES.findIndex(p => document.getElementById('tab-' + p).getAttribute('aria-selected') === 'true');
  const k = keys[e.key];
  const next = k === 'first' ? PAGES[0] : k === 'last' ? PAGES[PAGES.length - 1] : PAGES[(cur + k + PAGES.length) % PAGES.length];
  show(next, true); document.getElementById('tab-' + next).focus();
});

// แจ้งผลสั้น ๆ เมื่อมีการกระทำที่เปลี่ยนหน้า
const toast = document.getElementById('toast'); let toastT;
function notify(msg){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 2600);
}

// โหมดนำเสนอ: ซ่อนแถบด้านบนและขอเต็มจอ (Esc หรือปุ่มมุมขวาบนเพื่อออก)
const exitBtn = document.getElementById('exit-present');
function setPresent(on){
  document.body.classList.toggle('present', on);
  exitBtn.hidden = !on;
  if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else if (!on && document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
  const f = frames[PAGES.find(p => frames[p] && frames[p].classList.contains('on'))];
  try { f && f.contentWindow.dispatchEvent(new Event('resize')); } catch(e){}
}
document.getElementById('present').addEventListener('click', () => setPresent(true));
exitBtn.addEventListener('click', () => setPresent(false));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('present')) setPresent(false); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
  if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) setPresent(!document.body.classList.contains('present'));
  else if (e.key === 'Escape' && document.body.classList.contains('present')) setPresent(false);
});

// หน้า "Tap Planner" ส่ง sketch มาให้สนาม C++ รัน
addEventListener('message', ev => {
  const d = ev.data;
  if (!d || d.type !== 'alvik-hub:run-in-arena' || !frames.tap || ev.source !== frames.tap.contentWindow) return;
  const fresh = !frames.arena, f = ensure('arena');
  const go = () => { try {
    const A = f.contentWindow.alvik;
    A.setLayout(d.layout); A.code.set(d.code); A.code.run();
    notify('ส่งเส้นทางจาก Tap Planner มารันในสนามแข่ง C++ แล้ว');
  } catch(e){ console.error(e); notify('รันโค้ดจาก Tap Planner ไม่สำเร็จ ลองกดคอมไพล์ & รันในสนามแข่งอีกครั้ง'); } };
  show('arena', true);
  if (fresh || !f.contentWindow.alvik) f.addEventListener('load', () => setTimeout(go, 50), {once:true}); else go();
});
addEventListener('hashchange', () => show(location.hash.slice(1), false));
let start = location.hash.slice(1);
if (!PAGES.includes(start)) { try { start = localStorage.getItem('alvik-sim-hub-page') || 'arena'; } catch(e){ start = 'arena'; } }
show(start, false);
</script>
